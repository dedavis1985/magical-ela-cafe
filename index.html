<!doctype html><html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><meta name="theme-color" content="#241b35"><title>Magical ELA Café | Visual DBA Playground</title><style>
:root{font-family:Georgia,'Times New Roman',serif;color:#f8f0dc;background:#171323}*{box-sizing:border-box}body{margin:0;min-height:100vh;background:radial-gradient(ellipse at 50% 0,#493458 0,#251c36 42%,#151321 100%);line-height:1.5}button,input,select{font:inherit}button{cursor:pointer}button:focus-visible,input:focus-visible{outline:3px solid #e7bd73;outline-offset:3px}.shell{max-width:1150px;margin:auto;padding:20px 22px 80px}.top{display:flex;align-items:center;justify-content:space-between;gap:15px;flex-wrap:wrap}.brand{font-size:1.05rem;color:#e8c991;letter-spacing:.07em}.small{font-size:.86rem;color:#d8c6d9}.pill{border:1px solid #c4a77666;border-radius:40px;padding:8px 13px;background:#32273c;color:#f6e9ce}.hero{text-align:center;padding:38px 15px 30px}.spark{font-size:2.5rem}.hero h1{font-size:clamp(2.5rem,6vw,4.5rem);line-height:1.08;margin:10px 0;color:#f6db9c;text-shadow:0 3px 25px #dfab5a55}.hero p{max-width:630px;margin:14px auto;color:#e3d4e5;font-size:1.05rem}.eyebrow{text-transform:uppercase;letter-spacing:.19em;color:#e7bf82;font-size:.78rem;font-weight:bold}.panel{background:#2d253aee;border:1px solid #a788a355;border-radius:22px;padding:23px;box-shadow:0 15px 40px #0a081633}.grid{display:grid;grid-template-columns:repeat(3,minmax(0,1fr));gap:17px}.room{border:1px solid #bfa27355;border-radius:19px;background:linear-gradient(145deg,#40324d,#292235);padding:22px;text-align:left;color:#f9eacb;min-height:190px;display:flex;flex-direction:column;gap:8px;transition:transform .15s,border .15s}.room:not(:disabled):hover{transform:translateY(-3px);border-color:#e4bf7e}.room:disabled{opacity:.49;cursor:not-allowed}.room .emoji{font-size:2.3rem}.room strong{font-size:1.25rem}.room span:last-child{font-size:.84rem;color:#d9c7d8}.actions{display:flex;gap:10px;flex-wrap:wrap;align-items:center}.btn{border:1px solid #d9b87d;border-radius:12px;padding:10px 16px;background:#d9b87d;color:#281e31;font-weight:bold}.btn.secondary{background:#3d314a;color:#f6e4c4}.btn.ghost{background:transparent;color:#ead6ac;border-color:#a88d6d}.btn:disabled{opacity:.4;cursor:not-allowed}.heading{font-size:1.8rem;color:#f1d39b;margin:0 0 12px}.muted{color:#d7c5d7}.setup{max-width:740px;margin:25px auto}.field{margin:16px 0}.field label{display:block;margin-bottom:8px;color:#f5dfb1}.field select,.field input{background:#1e192a;border:1px solid #a990a3;color:#fff5df;border-radius:10px;padding:10px;width:100%}.checkgrid{display:grid;grid-template-columns:repeat(3,1fr);gap:10px}.checktile{display:flex;align-items:center;gap:8px;background:#3d3049;border:1px solid #725d7b;border-radius:12px;padding:12px}.checktile input{width:auto;accent-color:#e5bd79}.notice{border-left:3px solid #e6c185;padding:10px 13px;background:#44354c;margin:16px 0;color:#f3e4d2}.challenge{max-width:890px;margin:20px auto}.challenge h2{font-size:2rem;color:#f3d399;margin:8px 0}.visual{background:#171524;border:1px solid #bfa27366;border-radius:16px;padding:12px;margin:14px 0}.visual svg{display:block;width:100%;height:auto;max-height:340px}.visual-caption{font-size:.88rem;color:#ead7b7;text-align:center;margin:8px 0 0}.view-toggle{margin:12px 0}.view-toggle .btn[aria-pressed="true"]{background:#d9b87d;color:#281e31}.quote{background:#1e192b;border-left:4px solid #d7b579;border-radius:12px;padding:16px;margin:13px 0;font-size:1.12rem}.options{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:10px;margin:15px 0}.option{padding:15px;text-align:left;border:1px solid #8b7592;background:#3c304a;color:#f6eadc;border-radius:12px}.option.selected{background:#625077;border:2px solid #f0c987;padding:14px}.result{padding:14px;background:#473c51;border-radius:12px;margin:12px 0}.feedback{color:#f5d79d}.question{background:#49364e;border:1px solid #a68888;border-radius:15px;padding:18px;margin:18px 0}.question strong{color:#f8d998}.steps{display:flex;gap:8px;flex-wrap:wrap;margin:15px 0}.step{font-size:.8rem;border-radius:50px;padding:5px 11px;border:1px solid #7e6b86;color:#e6d5df}.step.active{background:#d9b87d;color:#2d2031}.teacher{background:#263e3d;border:1px solid #83aca1;border-radius:13px;padding:15px;margin:12px 0}.teacher h3{margin:0 0 8px;color:#ccebdc}.footer{text-align:center;margin-top:45px;color:#baa9c3;font-size:.8rem}.hidden{display:none!important}.toast{padding:10px;border-radius:10px;background:#3c5146;color:#f3ffef;margin-top:12px}a{color:#f7d697}@media(max-width:750px){.grid{grid-template-columns:repeat(2,minmax(0,1fr))}.shell{padding:15px 13px 60px}.room{min-height:170px;padding:16px}.checkgrid{grid-template-columns:repeat(2,1fr)}}@media(max-width:470px){.grid,.options{grid-template-columns:1fr}.hero{padding:20px 4px}.room{min-height:unset}.top{align-items:flex-start}}
.custom-image{display:block;width:100%;max-height:420px;object-fit:contain;border-radius:12px}.image-manager-row{display:grid;grid-template-columns:1fr auto;gap:10px;align-items:center;margin:12px 0}.image-manager-row input{max-width:100%}.image-preview{width:180px;max-height:110px;object-fit:cover;border-radius:8px}.image-manager-controls{display:flex;gap:8px;flex-wrap:wrap}.image-manager-controls button{font-size:.85rem}.field textarea{background:#1e192a;border:1px solid #a990a3;color:#fff5df;border-radius:10px;padding:10px;width:100%;font:inherit;resize:vertical}
.interactive-card{background:#211b30;border:1px solid #a88baf;border-radius:14px;padding:14px;margin:10px 0}.interactive-card[draggable="true"]{cursor:grab}.interactive-card.chosen{outline:3px solid #edc881}.dropzone{min-height:100px;border:2px dashed #ae8aaf;border-radius:15px;padding:12px;background:#362a44}.dropzone.over{background:#59446a}.tile{border:1px solid #a88baf;background:#453550;color:#fff2da;border-radius:9px;padding:9px 12px;margin:4px;cursor:pointer}.tile.active{background:#9c7aa7}.chip{display:inline-block;background:#554266;border-radius:8px;padding:6px 10px;margin:3px}.passage{font-size:1.08rem;line-height:2}.passage button{background:transparent;color:#f9edcf;border:0;border-bottom:2px dotted #c9a87b;padding:2px 4px}.passage button.marked{background:#8e6c43;border-radius:5px}.builder{display:flex;flex-wrap:wrap;gap:7px;min-height:58px}.interactive-tools{display:flex;gap:8px;flex-wrap:wrap;margin:14px 0}.interact-select{padding:9px;border-radius:10px;background:#211b30;color:#f8eacf;border:1px solid #bca178}</style></head><body><div class="shell"><header class="top"><div class="brand">✦ THE MAGICAL ELA CAFÉ</div><div class="actions"><span id="modeBadge" class="small"></span><button class="pill" id="homeBtn">⌂ Lobby</button><button class="pill" id="setupBtn">⚙ Teacher Setup</button></div></header><main id="app"></main><footer class="footer">A little magic. A lot of mastery. ✨ · 7th Grade Visual DBA Playground · No student information collected</footer></div><script>
'use strict';
const rooms=[['🌿','The Enchanted Story Garden','Figurative language · central idea · theme · hyphens · setting and mood'],['🪶','The Research & Remedy Room','Informative problem–solution writing conference'],['🧪','The Persuasion Parlor','Fallacies · purpose · perspective · allusions · comparing authors'],['⚙️','The Great Debate Workshop','Argumentative writing conference: humans vs. machines'],['📖','The Storybook Sanctuary','Short stories · summary · conflict · characters · theme · poetry'],['🕰️','The Storyteller’s Studio','Narration and narrative techniques']];
const activities=[
{title:'Mirror of Comparisons',icon:'🪞',skill:'Similes and metaphors',intro:'Examine the enchanted garden descriptions.',prompt:'“The moon was a silver coin above the garden.”',question:'What type of figurative language is used?',options:['Simile','Metaphor','Neither'],answer:1,why:'A metaphor directly compares the moon to a silver coin without using like or as.',talk:'What two things are compared? What picture does the comparison create for the reader?',apply:'Create a simile that describes the same moon. How is your comparison different?',hint:'Look for a comparison that does not use like or as.',variants:[['“The leaves danced like tiny emerald flags in the wind.”','What type of figurative language is used?',['Simile','Metaphor','Neither'],0,'Like introduces a comparison between leaves and flags.'],['“The old oak was a guardian at the garden gate.”','What type of figurative language is used?',['Simile','Metaphor','Neither'],1,'The oak is directly described as a guardian.']]},
{title:'The Central Idea Tree',icon:'🌳',skill:'Central idea',intro:'Read the informational passage and choose the central idea.',prompt:'“City gardens provide more than beautiful spaces. They give pollinators food, help cool neighborhoods, and offer residents places to grow vegetables. Even small gardens can benefit the community.”',question:'Which statement best expresses the central idea?',options:['Gardens always grow vegetables.','City gardens benefit communities in several ways.','Pollinators only live in cities.'],answer:1,why:'The passage describes several different benefits of city gardens; the central idea includes them all.',talk:'Which two details from the passage support the central idea? Why is a single detail not the central idea?',apply:'Give the passage a heading that communicates its central idea.',hint:'Choose the idea that covers the whole passage, not just one fact.',variants:[['“Public libraries lend books, but they also offer internet access, workshops, and quiet places to study. These services help people of many ages learn.”','Which is the best central idea?',['Libraries only lend books.','Libraries support learning through many services.','Workshops are always quiet.'],1,'All the examples show how libraries help people learn.']]},
{title:'The Growing Theme',icon:'🌱',skill:'Theme development',intro:'Follow the events in this miniature story.',prompt:'“Mira failed to grow her first seedlings. She wanted to abandon the garden, but her grandfather encouraged her to try again. She adjusted the sunlight and watering. Weeks later, green shoots appeared, and Mira smiled at what patience had made possible.”',question:'Which theme is best supported by the events?',options:['Gardens need sunlight.','Persistence can lead to growth.','Grandparents know everything.'],answer:1,why:'Mira faces failure, makes changes, persists, and eventually succeeds. The events develop the theme of persistence.',talk:'How does Mira change from the beginning to the end? Which event most strongly develops the theme?',apply:'Suggest another event that would reinforce the same theme.',hint:'A theme is a message about life, not just the topic of gardening.',variants:[['“Jon was afraid to perform. He practiced in small groups, then volunteered to read a poem aloud. His voice shook, but he finished and felt proud.”','Which theme is best supported?',['Courage can mean acting despite fear.','Poetry is always easy.','Performers never feel nervous.'],0,'Jon acts even though he remains afraid.']]},
{title:'The Hyphen Spell',icon:'✨',skill:'Hyphens',intro:'Help the café repair its enchanted signs.',prompt:'“Try our freshly baked, sugar free cookies!”',question:'Which revision correctly uses a hyphen in the compound modifier?',options:['Try our freshly-baked, sugar free cookies!','Try our freshly baked, sugar-free cookies!','Try our freshly baked, sugar free-cookies!'],answer:1,why:'Sugar-free is a compound modifier before cookies. An -ly adverb such as freshly does not typically take a hyphen with the participle it modifies.',talk:'Why is sugar-free hyphenated here? Why is freshly baked not hyphenated?',apply:'Use a correctly hyphenated compound modifier in your own café advertisement.',hint:'Look for two words that work together to describe a noun before it.',variants:[['“The cafe displayed a well known recipe.”','Which revision is correct?',['The cafe displayed a well-known recipe.','The cafe displayed a well known-recipe.','The cafe displayed a wellknown recipe.'],0,'Well-known modifies recipe before the noun.']]},
{title:'The Mood Changer',icon:'🌧️',skill:'Setting and mood',intro:'Read the description and notice the sensory details.',prompt:'“The empty café creaked as rain struck the dark windows. A single candle flickered, casting long shadows across the floor.”',question:'What mood do the setting details most strongly create?',options:['Playful and cheerful','Tense and eerie','Peaceful and sunny'],answer:1,why:'Creaking, dark windows, flickering light, and long shadows create an uneasy atmosphere.',talk:'Which words or images establish the mood? How does the setting influence the reader’s feelings?',apply:'Change two details to make the same café feel welcoming instead.',hint:'Imagine how you would feel if you were standing in this setting.',variants:[['“Golden sunlight spilled across the café tables. Warm cinnamon scented the air as friends laughed by the window.”','What mood is created?',['Warm and welcoming','Threatening and eerie','Lonely and hopeless'],0,'Sunlight, cinnamon, and laughter establish a cozy mood.']]}
];
/* IMAGE_PACK_START */
const publishedImages = {};
/* IMAGE_PACK_END */
/* PROMPT_PACK_START */
/* PROMPT_PACK_END */
const imageOverrides = {};
const publishedPrompts = {};
const promptOverrides = {};
const defaultVisualPrompts = {0:{discover:"Study the image. What comparison could you make using a simile or metaphor?",explain:"What details in the image support your comparison? Explain the meaning you want to convey.",apply:"Create both a simile and a metaphor inspired by this image. How do they differ?"},2:{discover:"Study the sequence or scene. What lesson about life could it suggest?",explain:"Which visible actions or details support that theme?",apply:"Describe an additional event that would develop the same theme."},3:{discover:"Study the sign or advertisement. Find a compound modifier that may need a hyphen.",explain:"Explain why a hyphen is or is not needed in that phrase.",apply:"Create a new sentence using a correctly hyphenated compound modifier."},4:{discover:"Compare the visual settings. What mood does each create?",explain:"Identify specific details that create those moods.",apply:"Describe sensory details a writer could use to establish one of these moods."}};
function visualPrompts(a,v){return {...defaultVisualPrompts[a],...(publishedPrompts[imageKey(a,v)]||{}),...(promptOverrides[imageKey(a,v)]||{})}}
function imageKey(a,v){return `m1-a${a}-v${v}`}
function imageFor(a,v){const key=imageKey(a,v);return imageOverrides[key]||publishedImages[key]||null}
function imageMarkup(a,v){const sources=imageFor(a,v);if(!sources||!sources.length)return `<div class="visual" role="status"><p class="visual-caption">🖼️ No visual challenge image assigned for this example. Choose another example or switch to Text Challenge.</p></div>`;return `<div class="visual"><div class="image-manager-controls">${sources.map((src,i)=>`<img class="custom-image" src="${src}" alt="Visual challenge image ${i+1} for example ${v+1}" style="${sources.length>1?'width:calc(50% - 5px);display:inline-block;vertical-align:top;margin-right:5px':''}">`).join('')}</div><p class="visual-caption">Study the visual details, then explain your thinking aloud.</p></div>`}
async function readImage(file){return new Promise((resolve,reject)=>{const reader=new FileReader();reader.onload=()=>resolve(reader.result);reader.onerror=reject;reader.readAsDataURL(file)})}
function imageManager(){if(studentLink)return;route='images';updateTop();app.innerHTML=`<section class="panel setup" style="max-width:900px"><div class="eyebrow">Behind the counter</div><h2 class="heading">🖼️ Visual Challenge Image Manager</h2><p>Choose an activity and example, then upload one or two images. For Mood Changer, use two contrasting images of the same setting. Images are previewed locally until you export and publish an updated HTML file.</p><div class="field"><label for="imgActivity">Activity</label><select id="imgActivity">${activities.map((a,i)=>i===1?'':`<option value="${i}">${esc(a.title)}</option>`).join('')}</select></div><div class="field"><label for="imgVariant">Example</label><select id="imgVariant"></select></div><div class="field"><label for="imgFiles">Upload image(s) — PNG, JPG, WebP</label><input id="imgFiles" type="file" accept="image/png,image/jpeg,image/webp" multiple><p class="small">Use up to 2 images per example. Recommended: images under 1 MB each for a fast-loading site.</p></div><div id="imageCurrent"></div><h3>Visual challenge questions</h3><p class="small">These prompts belong to this specific example and will be included in the exported website.</p><div class="field"><label for="visualDiscover">Discover It</label><textarea id="visualDiscover" rows="3"></textarea></div><div class="field"><label for="visualExplain">Explain It</label><textarea id="visualExplain" rows="3"></textarea></div><div class="field"><label for="visualApply">Apply It</label><textarea id="visualApply" rows="3"></textarea></div><div class="actions"><button class="btn secondary" id="savePrompts">Save questions for this example</button></div><div class="actions"><button class="btn secondary" id="removeImgs">Remove images for this example</button><button class="btn" id="exportHtml">⬇ Export updated index.html</button><button class="btn ghost" id="imageBack">← Teacher Setup</button></div><div class="notice" id="imgStatus">After exporting, replace your GitHub repository's index.html with the downloaded file. Students will then see your uploaded images.</div></section>`;
const act=document.getElementById('imgActivity'),variantSel=document.getElementById('imgVariant');function refreshVariants(){const i=Number(act.value);variantSel.innerHTML=Array.from({length:activities[i].variants.length+1},(_,v)=>`<option value="${v}">Example ${v+1}</option>`).join('');preview()};function preview(){const i=Number(act.value),v=Number(variantSel.value),src=imageFor(i,v);const prompts=visualPrompts(i,v);for(const [id,k] of [['visualDiscover','discover'],['visualExplain','explain'],['visualApply','apply']])document.getElementById(id).value=prompts[k]||'';document.getElementById('imageCurrent').innerHTML=`<h3>Current image(s) — Example ${v+1}</h3>${src?.length?src.map((u,n)=>`<img class="image-preview" src="${u}" alt="Uploaded visual ${n+1}" style="margin:5px">`).join(''):'<p class="small">No custom images assigned yet. The visual challenge will show a missing-image message until you upload one.</p>'}`}
act.onchange=refreshVariants;variantSel.onchange=preview;refreshVariants();document.getElementById('imgFiles').onchange=async e=>{const files=[...e.target.files].slice(0,2);if(!files.length)return;if(files.some(f=>!['image/png','image/jpeg','image/webp'].includes(f.type))){document.getElementById('imgStatus').textContent='Please select PNG, JPG or WebP images.';return}const imgs=await Promise.all(files.map(readImage));imageOverrides[imageKey(Number(act.value),Number(variantSel.value))]=imgs;preview();document.getElementById('imgStatus').textContent='Images assigned in this browser. Export the updated index.html to publish them.'};document.getElementById('savePrompts').onclick=()=>{const key=imageKey(Number(act.value),Number(variantSel.value));promptOverrides[key]={discover:document.getElementById('visualDiscover').value,explain:document.getElementById('visualExplain').value,apply:document.getElementById('visualApply').value};document.getElementById('imgStatus').textContent='Questions saved for this example. Export the website to publish them.'};document.getElementById('removeImgs').onclick=()=>{imageOverrides[imageKey(Number(act.value),Number(variantSel.value))]=[];preview()};document.getElementById('imageBack').onclick=setup;document.getElementById('exportHtml').onclick=exportImages}
async function exportImages(){const status=document.getElementById('imgStatus');status.textContent='Preparing your website file…';try{const response=await fetch(location.href.split('?')[0].split('#')[0]);if(!response.ok)throw Error('Could not read website source');let html=await response.text();const combined={...publishedImages,...imageOverrides};const combinedPrompts={...publishedPrompts,...promptOverrides};const serialized=JSON.stringify(combined).replace(/</g,'\u003c');const replacement='/* IMAGE_PACK_START */\nconst publishedImages = '+serialized+';\n/* IMAGE_PACK_END */';html=html.replace(/\/\* IMAGE_PACK_START \*\/[\s\S]*?\/\* IMAGE_PACK_END \*\//,replacement);const promptsSerialized=JSON.stringify(combinedPrompts).replace(/</g,'\\u003c');html=html.replace(/\/\* PROMPT_PACK_START \*\/[\s\S]*?\/\* PROMPT_PACK_END \*\//,'/* PROMPT_PACK_START */\nObject.assign(publishedPrompts, '+promptsSerialized+');\n/* PROMPT_PACK_END */');const blob=new Blob([html],{type:'text/html'});const url=URL.createObjectURL(blob);const a=document.createElement('a');a.href=url;a.download='index.html';a.click();setTimeout(()=>URL.revokeObjectURL(url),3000);status.textContent='Downloaded updated index.html. Upload it to GitHub to publish your images.'}catch(e){status.textContent='Export could not read the source. Open this website through GitHub Pages or a local web server, not as a file:// page.'}}
const params=new URLSearchParams(location.search);const studentLink=params.get('view')==='student';const parsed=(params.get('modules')||'1').split(',').map(Number).filter(n=>n>=1&&n<=6);let unlocked=[...new Set(parsed.length?parsed:[1])];let mode=studentLink?'student':'teacher';let route='lobby',module=1,activity=0,variant=0,visualMode=false,selected=-1,showHint=false,showAnswer=false,showApply=false,showFeedback=false;const app=document.getElementById('app');const esc=s=>String(s).replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));function resetActivity(){selected=-1;showHint=false;showAnswer=false;showApply=false;showFeedback=false}function getData(){const a=activities[activity];if(variant===0)return {prompt:a.prompt,question:a.question,options:a.options,answer:a.answer,why:a.why};const v=a.variants[(variant-1)%a.variants.length];return{prompt:v[0],question:v[1],options:v[2],answer:v[3],why:v[4]}}function updateTop(){document.getElementById('modeBadge').textContent=mode==='teacher'?'✦ Teacher-Led':'✦ Student Explorer';document.getElementById('setupBtn').classList.toggle('hidden',studentLink)}function lobby(){route='lobby';updateTop();app.innerHTML=`<section class="hero"><div class="spark">☕ ✨ 📚</div><div class="eyebrow">Welcome, curious minds</div><h1>The Magical ELA Café</h1><p>Step inside, choose your enchanted learning room, and show what you know. Every great answer begins with a little curiosity.</p></section><div class="grid">${rooms.map((r,i)=>`<button class="room" data-room="${i+1}" ${unlocked.includes(i+1)?'':'disabled'}><span class="emoji">${r[0]}</span><strong>Module ${i+1}<br>${r[1]}</strong><span>${unlocked.includes(i+1)?r[2]:'🔒 Currently closed'}</span></button>`).join('')}</div>${mode==='teacher'?'<p class="small" style="text-align:center;margin-top:18px">Teacher tip: Use ⚙ Teacher Setup to choose which rooms students see.</p>':''}`;app.querySelectorAll('[data-room]').forEach(b=>b.onclick=()=>openModule(Number(b.dataset.room)))}
function openModule(n){if(!unlocked.includes(n))return;module=n;route='module';updateTop();if(n!==1){app.innerHTML=`<section class="challenge panel"><div class="eyebrow">Module ${n}</div><h2>${rooms[n-1][0]} ${rooms[n-1][1]}</h2><p>${rooms[n-1][2]}</p><div class="notice">This room is reserved for the next build phase. Module 1 is the fully interactive prototype.</div><button class="btn secondary" id="back">← Back to Café</button></section>`;document.getElementById('back').onclick=lobby;return}moduleMenu()}
function moduleMenu(){route='module';app.innerHTML=`<section class="hero"><div class="eyebrow">Module 1 · The Enchanted Story Garden</div><h1>Choose a Mastery Challenge</h1><p>Explore a skill, make a choice, then explain your thinking aloud.</p></section><div class="grid">${activities.map((a,i)=>`<button class="room" data-act="${i}"><span class="emoji">${a.icon}</span><strong>${a.title}</strong><span>${a.skill}</span></button>`).join('')}</div><div class="actions" style="margin-top:22px"><button class="btn ghost" id="back">← Café Lobby</button></div>`;app.querySelectorAll('[data-act]').forEach(b=>b.onclick=()=>{activity=Number(b.dataset.act);variant=0;visualMode=false;resetActivity();challenge()});document.getElementById('back').onclick=lobby}
function challenge(){route='challenge';const a=activities[activity],d=getData(),visual=visualMode&&activity!==1, vp=visual?visualPrompts(activity,variant):null;const visualBody=visual?`${imageMarkup(activity,variant)}<div class="question"><strong>Discover It:</strong><p>${esc(vp.discover||'')}</p></div>`:`<div class="quote">${esc(d.prompt)}</div><h3>${esc(d.question)}</h3><div class="options">${d.options.map((o,i)=>`<button class="option ${selected===i?'selected':''}" data-opt="${i}" aria-pressed="${selected===i}">${esc(o)}</button>`).join('')}</div>`;app.innerHTML=`<section class="challenge"><div class="actions"><button class="btn ghost" id="back">← All Challenges</button><span class="small">Module 1 · ${esc(a.skill)}</span></div><div class="panel" style="margin-top:16px"><div class="eyebrow">${a.icon} The Enchanted Story Garden</div><h2>${esc(a.title)}</h2><p class="muted">${visual?'Examine the image and explain your observations aloud.':esc(a.intro)}</p><div class="steps"><span class="step active">1 · Discover</span><span class="step">2 · Explain</span><span class="step">3 · Apply</span></div><div class="actions view-toggle"><button class="btn secondary" id="textView" aria-pressed="${!visual}">📖 Text Challenge</button>${activity!==1?`<button class="btn secondary" id="visualView" aria-pressed="${visual}">🖼️ Visual Challenge</button>`:''}</div>${visualBody}<div class="actions"><button class="btn secondary" id="hint">${showHint?'Hide Hint':'💡 Hint'}</button><button class="btn secondary" id="explain">${showFeedback?'Hide Explanation Prompt':'💬 Explain Your Thinking'}</button><button class="btn secondary" id="apply">${showApply?'Hide Application':'✨ Apply It'}</button></div>${showHint?`<div class="result"><strong>Gentle hint:</strong> ${esc(visual?'Look closely at specific details in the image. Describe what you notice before interpreting it.':a.hint)}</div>`:''}${showFeedback?`<div class="question"><strong>Explain aloud:</strong><p>${esc(visual?vp.explain:variant&&activity===0?'What is being compared in this example? What image does that comparison create?':variant&&activity===2?'How do the character’s actions and changes develop the theme? Which event is most important?':a.talk)}</p></div>`:''}${showApply?`<div class="question"><strong>Apply your knowledge:</strong><p>${esc(visual?vp.apply:variant&&activity===0?(variant===1?'Write a new metaphor about the leaves. How does it differ from the simile?':'Write a simile describing the oak tree. How does it differ from the metaphor?'):variant&&activity===2?'Suggest a new event that would reinforce the theme in this version of the story.':a.apply)}</p></div>`:''}${mode==='teacher'?`<div class="teacher"><h3>🔎 Teacher Guide</h3>${visual?'<p>Open-ended visual assessment: look for a clear interpretation supported by specific visual details and an accurate application of the target skill.</p>':`<button class="btn secondary" id="answer">${showAnswer?'Hide Suggested Answer':'Reveal Suggested Answer'}</button>${showAnswer?`<p><strong>Correct choice:</strong> ${esc(d.options[d.answer])}</p><p>${esc(d.why)}</p><p><strong>Look for:</strong> A reasoned explanation using relevant text evidence, not just the correct selection.</p>`:''}`}</div>`:''}<div class="actions" style="margin-top:22px"><button class="btn ghost" id="another">↻ Try Another Example</button><button class="btn ghost" id="reset">Reset</button><button class="btn" id="next">Next Skill →</button></div></div></section>`;document.getElementById('back').onclick=moduleMenu;document.getElementById('textView').onclick=()=>{visualMode=false;resetActivity();challenge()};if(activity!==1)document.getElementById('visualView').onclick=()=>{visualMode=true;resetActivity();challenge()};app.querySelectorAll('[data-opt]').forEach(b=>b.onclick=()=>{selected=Number(b.dataset.opt);challenge()});document.getElementById('hint').onclick=()=>{showHint=!showHint;challenge()};document.getElementById('explain').onclick=()=>{showFeedback=!showFeedback;challenge()};document.getElementById('apply').onclick=()=>{showApply=!showApply;challenge()};if(mode==='teacher'&&!visual)document.getElementById('answer').onclick=()=>{showAnswer=!showAnswer;challenge()};document.getElementById('another').onclick=()=>{variant=(variant+1)%(a.variants.length+1);resetActivity();challenge()};document.getElementById('reset').onclick=()=>{resetActivity();challenge()};document.getElementById('next').onclick=()=>{activity=(activity+1)%activities.length;variant=0;visualMode=false;resetActivity();challenge()}}
function setup(){if(studentLink)return;route='setup';updateTop();app.innerHTML=`<section class="panel setup"><div class="eyebrow">Behind the counter</div><h2 class="heading">⚙ Teacher Setup</h2><p class="muted">Choose which module rooms are visible in the student link. This setup does not collect or save student information.</p><div class="field"><label>Unlock modules</label><div class="checkgrid">${rooms.map((r,i)=>`<label class="checktile"><input type="checkbox" data-mod="${i+1}" ${unlocked.includes(i+1)?'checked':''}> Module ${i+1}</label>`).join('')}</div></div><div class="field"><label for="mode">How will this DBA run?</label><select id="mode"><option value="teacher" ${mode==='teacher'?'selected':''}>Teacher-Led · You click and screen-share</option><option value="student" ${mode==='student'?'selected':''}>Student Explorer · Student clicks independently</option></select></div><div class="notice"><strong>Privacy & access:</strong> Student links only show the selected module rooms in the interface. They are not secure locks. Anyone with a link can inspect publicly served website files. Teacher guides in this prototype are convenience features, not confidential assessment keys.</div><div class="actions"><button class="btn" id="save">Apply Settings</button><button class="btn secondary" id="copy">Copy Student Link</button><button class="btn ghost" id="back">Cancel</button></div><div id="status" role="status" aria-live="polite"></div></section>`;document.getElementById('mode').onchange=e=>mode=e.target.value;document.getElementById('save').onclick=()=>{if(!readChecks())return;const u=new URL(location.href);u.search='';history.replaceState(null,'',u.pathname);lobby()};document.getElementById('copy').onclick=async()=>{if(!readChecks())return;const u=new URL(location.href);u.search='';u.searchParams.set('view','student');u.searchParams.set('modules',unlocked.join(','));try{await navigator.clipboard.writeText(u.href);document.getElementById('status').innerHTML='<div class="toast">Student link copied! Send it to your student.</div>'}catch{document.getElementById('status').innerHTML=`<div class="toast">Copy this link: <input aria-label="Student link" readonly value="${esc(u.href)}" onclick="this.select()"></div>`}};document.getElementById('back').onclick=lobby}
function readChecks(){const checked=[...document.querySelectorAll('[data-mod]:checked')].map(e=>Number(e.dataset.mod));if(!checked.length){document.getElementById('status').textContent='Unlock at least one module.';return false}unlocked=checked;return true}
const oldSetup=setup;setup=function(){oldSetup();if(studentLink)return;const container=app.querySelector('.setup');if(container){const b=document.createElement('button');b.className='btn secondary';b.textContent='🖼️ Manage Visual Challenge Images';b.onclick=imageManager;container.appendChild(b)}};

let interactionMode=false,interactiveIndex=0,interactState={};
function resetInteract(){interactState={chosen:null,placed:{},order:[],marked:{},built:[],step:0,answers:[],reveal:false};}
function startInteract(n=0){interactiveIndex=n;interactionMode=true;resetInteract();renderInteract();}
function renderInteract(){const d=interactionLibrary[module][interactiveIndex];route='interactive';updateTop();const state=interactState;let body='';
if(d.type==='sort'){body=`<p class="muted">Select a card, then tap a category, or drag a card onto a category.</p><div class="grid" style="grid-template-columns:repeat(auto-fit,minmax(210px,1fr))">${d.cards.map((c,i)=>`<button draggable="true" data-card="${i}" class="interactive-card ${state.chosen===i?'chosen':''}" style="color:#f8eacf;text-align:left">${esc(c[0])}${state.placed[i]!==undefined?`<div class="small">Placed: ${esc(d.bins[state.placed[i]])}</div>`:''}</button>`).join('')}</div><div class="grid" style="grid-template-columns:repeat(${d.bins.length},minmax(0,1fr))">${d.bins.map((b,i)=>`<button class="dropzone" data-bin="${i}" style="color:#f8eacf">${esc(b)}<div class="small">${Object.values(state.placed).filter(x=>x===i).length} cards</div></button>`).join('')}</div>`;}
if(d.type==='sequence'){body=`<p class="muted">Select the next event in the correct order. Use Undo if needed.</p><div class="builder">${state.order.map(i=>`<span class="chip">${esc(d.cards[i])}</span>`).join('')}</div><div>${d.cards.map((c,i)=>state.order.includes(i)?'':`<button class="tile" data-seq="${i}">${esc(c)}</button>`).join('')}</div><button class="btn ghost" id="undoSeq">↶ Undo last</button>`;}
if(d.type==='highlight'){body=`<p class="muted">Tap phrases to highlight them. Explain what makes each detail relevant.</p><div class="interactive-card passage">${d.segments.map((x,i)=>`<button data-seg="${i}" class="${state.marked[i]?'marked':''}" aria-pressed="${!!state.marked[i]}">${esc(x[0])}</button>`).join('')}</div>`;}
if(d.type==='build'){const pool=[...d.cards,...d.distractors];body=`<p class="muted">Select the tiles in the order you want to use them.</p><div class="dropzone builder">${state.built.map(i=>`<span class="chip">${esc(pool[i])}</span>`).join('')}</div><div>${pool.map((c,i)=>state.built.includes(i)?'':`<button class="tile" data-build="${i}">${esc(c)}</button>`).join('')}</div><button class="btn ghost" id="undoBuild">↶ Undo last</button>`;}
if(d.type==='path'){const st=d.steps[state.step];body=`<p class="small">Decision ${state.step+1} of ${d.steps.length}</p><div class="question"><strong>${esc(st.question)}</strong></div><div class="options">${st.choices.map((c,i)=>`<button class="option ${state.answers[state.step]===i?'selected':''}" data-choice="${i}">${esc(c[0])}</button>`).join('')}</div>${state.answers[state.step]!==undefined?`<div class="result">${esc(st.choices[state.answers[state.step]][1])}</div>`:''}<div class="actions"><button class="btn secondary" id="prevPath" ${state.step===0?'disabled':''}>← Previous</button><button class="btn" id="nextPath" ${state.answers[state.step]===undefined||state.step===d.steps.length-1?'disabled':''}>Next decision →</button></div>`;}
const prompt= d.type==='sort'?'Why does each card belong in its category?':d.type==='sequence'?'How does this sequence develop the meaning or structure?':d.type==='highlight'?'Which highlighted detail is strongest, and why?':d.type==='build'?'Explain your choices and revise one element aloud.':'What did your choices reveal about the skill?';
app.innerHTML=`<section class="challenge"><div class="actions"><button class="btn ghost" id="interBack">← ${module===1?'All Challenges':'Module Room'}</button><span class="small">Module ${module} · ${esc(d.skill)}</span></div><div class="panel" style="margin-top:16px"><div class="eyebrow">✨ Interactive Challenge</div><h2>${esc(d.name)}</h2><p>${esc(d.instruction)}</p><div class="interactive-tools"><label for="interactiveSelect" class="small">Activity:</label><select class="interact-select" id="interactiveSelect">${interactionLibrary[module].map((x,i)=>`<option value="${i}" ${i===interactiveIndex?'selected':''}>${esc(x.name)}</option>`).join('')}</select></div>${body}<div class="actions" style="margin-top:18px"><button class="btn secondary" id="checkInteract">🔎 Check My Work</button><button class="btn ghost" id="resetInteract">↻ Reset</button></div>${state.reveal?`<div class="result" role="status">${interactionFeedback(d,state)}<p><strong>Explain aloud:</strong> ${esc(prompt)}</p></div>`:''}<div class="question"><strong>💬 Explain Your Thinking</strong><p>${esc(prompt)}</p><strong>✨ Apply It</strong><p>Give a new example of this skill and explain how it works.</p></div></div></section>`;
document.getElementById('interBack').onclick=()=>{interactionMode=false;if(module===1)moduleMenu();else moduleInteractiveMenu()};document.getElementById('interactiveSelect').onchange=e=>startInteract(Number(e.target.value));document.getElementById('resetInteract').onclick=()=>{resetInteract();renderInteract()};document.getElementById('checkInteract').onclick=()=>{state.reveal=true;renderInteract()};
if(d.type==='sort'){app.querySelectorAll('[data-card]').forEach(el=>{const i=Number(el.dataset.card);el.onclick=()=>{state.chosen=i;state.reveal=false;renderInteract()};el.ondragstart=e=>{e.dataTransfer.setData('text/plain',String(i))}});app.querySelectorAll('[data-bin]').forEach(el=>{const i=Number(el.dataset.bin);const assign=(n)=>{if(n===null||!Number.isInteger(n))return;state.placed[n]=i;state.chosen=null;state.reveal=false;renderInteract()};el.onclick=()=>assign(state.chosen);el.ondragover=e=>e.preventDefault();el.ondrop=e=>{e.preventDefault();assign(Number(e.dataTransfer.getData('text/plain')))}})}
if(d.type==='sequence'){app.querySelectorAll('[data-seq]').forEach(el=>el.onclick=()=>{state.order.push(Number(el.dataset.seq));state.reveal=false;renderInteract()});document.getElementById('undoSeq').onclick=()=>{state.order.pop();state.reveal=false;renderInteract()}}
if(d.type==='highlight'){app.querySelectorAll('[data-seg]').forEach(el=>el.onclick=()=>{const i=Number(el.dataset.seg);state.marked[i]=!state.marked[i];state.reveal=false;renderInteract()})}
if(d.type==='build'){app.querySelectorAll('[data-build]').forEach(el=>el.onclick=()=>{state.built.push(Number(el.dataset.build));state.reveal=false;renderInteract()});document.getElementById('undoBuild').onclick=()=>{state.built.pop();state.reveal=false;renderInteract()}}
if(d.type==='path'){app.querySelectorAll('[data-choice]').forEach(el=>el.onclick=()=>{state.answers[state.step]=Number(el.dataset.choice);state.reveal=false;renderInteract()});document.getElementById('prevPath').onclick=()=>{state.step--;state.reveal=false;renderInteract()};document.getElementById('nextPath').onclick=()=>{state.step++;state.reveal=false;renderInteract()}}
}
function interactionFeedback(d,s){let correct=0,total=0;if(d.type==='sort'){total=d.cards.length;correct=d.cards.filter((c,i)=>s.placed[i]!==undefined&&d.bins[s.placed[i]]===c[1]).length}if(d.type==='sequence'){total=d.cards.length;correct=s.order.filter((v,i)=>v===i).length}if(d.type==='highlight'){total=d.segments.filter(x=>x[1]==='yes').length;correct=d.segments.filter((x,i)=>x[1]==='yes'&&s.marked[i]).length;const extra=d.segments.filter((x,i)=>x[1]!=='yes'&&s.marked[i]).length;return `Relevant details selected: ${correct}/${total}. ${extra?'Review '+extra+' unrelated selection(s).':'No unrelated selections.'}`}if(d.type==='build'){total=d.cards.length;correct=s.built.filter((v,i)=>v===i).length}if(d.type==='path')return `You explored ${s.answers.filter(x=>x!==undefined).length} of ${d.steps.length} decisions. Discuss the reasoning behind each choice.`;return `${correct} of ${total} correctly placed or ordered. ${correct===total?'Great! Explain why the arrangement works.':'Try revising and checking again.'}`}
function moduleInteractiveMenu(){route='module';updateTop();app.innerHTML=`<section class="hero"><div class="eyebrow">Module ${module}</div><h1>${rooms[module-1][0]} ${rooms[module-1][1]}</h1><p>Choose an interactive challenge. Read, discuss, and apply the skill aloud.</p></section><div class="grid">${interactionLibrary[module].map((d,i)=>`<button class="room" data-inter="${i}"><span class="emoji">${['🧩','🔢','🔎','✍️','🧭'][i]}</span><strong>${esc(d.name)}</strong><span>${esc(d.skill)}</span></button>`).join('')}</div><div class="actions" style="margin-top:22px"><button class="btn ghost" id="back">← Café Lobby</button></div>`;app.querySelectorAll('[data-inter]').forEach(el=>el.onclick=()=>startInteract(Number(el.dataset.inter)));document.getElementById('back').onclick=lobby}
const originalOpenModule=openModule;openModule=function(n){if(n===1)return originalOpenModule(n);if(!unlocked.includes(n))return;module=n;moduleInteractiveMenu()};
const originalModuleMenu=moduleMenu;moduleMenu=function(){originalModuleMenu();const box=app.querySelector('.actions[style]');if(box){const b=document.createElement('button');b.className='btn';b.textContent='🧩 Interactive Challenge Studio · 5 activities';b.onclick=()=>startInteract(0);box.prepend(b)}};
const originalChallenge=challenge;challenge=function(){originalChallenge();const toggle=app.querySelector('.view-toggle');if(toggle){const b=document.createElement('button');b.className='btn secondary';b.textContent='🧩 Interactive Challenge';b.onclick=()=>startInteract([0,2,1,3,4][activity]);toggle.appendChild(b)}};

document.getElementById('homeBtn').onclick=lobby;document.getElementById('setupBtn').onclick=setup;updateTop();lobby();
</script></body></html>
