<!doctype html><html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><meta name="theme-color" content="#241b35"><title>Magical ELA Café | Visual DBA Playground · V8</title><style>
:root{font-family:Georgia,'Times New Roman',serif;color:#f8f0dc;background:#171323}*{box-sizing:border-box}body{margin:0;min-height:100vh;background:radial-gradient(ellipse at 50% 0,#493458 0,#251c36 42%,#151321 100%);line-height:1.5}button,input,select{font:inherit}button{cursor:pointer}button:focus-visible,input:focus-visible{outline:3px solid #e7bd73;outline-offset:3px}.shell{max-width:1150px;margin:auto;padding:20px 22px 80px}.top{display:flex;align-items:center;justify-content:space-between;gap:15px;flex-wrap:wrap}.brand{font-size:1.05rem;color:#e8c991;letter-spacing:.07em}.small{font-size:.86rem;color:#d8c6d9}.pill{border:1px solid #c4a77666;border-radius:40px;padding:8px 13px;background:#32273c;color:#f6e9ce}.hero{text-align:center;padding:38px 15px 30px}.spark{font-size:2.5rem}.hero h1{font-size:clamp(2.5rem,6vw,4.5rem);line-height:1.08;margin:10px 0;color:#f6db9c;text-shadow:0 3px 25px #dfab5a55}.hero p{max-width:630px;margin:14px auto;color:#e3d4e5;font-size:1.05rem}.eyebrow{text-transform:uppercase;letter-spacing:.19em;color:#e7bf82;font-size:.78rem;font-weight:bold}.panel{background:#2d253aee;border:1px solid #a788a355;border-radius:22px;padding:23px;box-shadow:0 15px 40px #0a081633}.grid{display:grid;grid-template-columns:repeat(3,minmax(0,1fr));gap:17px}.room{border:1px solid #bfa27355;border-radius:19px;background:linear-gradient(145deg,#40324d,#292235);padding:22px;text-align:left;color:#f9eacb;min-height:190px;display:flex;flex-direction:column;gap:8px;transition:transform .15s,border .15s}.room:not(:disabled):hover{transform:translateY(-3px);border-color:#e4bf7e}.room:disabled{opacity:.49;cursor:not-allowed}.room .emoji{font-size:2.3rem}.room strong{font-size:1.25rem}.room span:last-child{font-size:.84rem;color:#d9c7d8}.actions{display:flex;gap:10px;flex-wrap:wrap;align-items:center}.btn{border:1px solid #d9b87d;border-radius:12px;padding:10px 16px;background:#d9b87d;color:#281e31;font-weight:bold}.btn.secondary{background:#3d314a;color:#f6e4c4}.btn.ghost{background:transparent;color:#ead6ac;border-color:#a88d6d}.btn:disabled{opacity:.4;cursor:not-allowed}.heading{font-size:1.8rem;color:#f1d39b;margin:0 0 12px}.muted{color:#d7c5d7}.setup{max-width:740px;margin:25px auto}.field{margin:16px 0}.field label{display:block;margin-bottom:8px;color:#f5dfb1}.field select,.field input{background:#1e192a;border:1px solid #a990a3;color:#fff5df;border-radius:10px;padding:10px;width:100%}.checkgrid{display:grid;grid-template-columns:repeat(3,1fr);gap:10px}.checktile{display:flex;align-items:center;gap:8px;background:#3d3049;border:1px solid #725d7b;border-radius:12px;padding:12px}.checktile input{width:auto;accent-color:#e5bd79}.notice{border-left:3px solid #e6c185;padding:10px 13px;background:#44354c;margin:16px 0;color:#f3e4d2}.challenge{max-width:890px;margin:20px auto}.challenge h2{font-size:2rem;color:#f3d399;margin:8px 0}.visual{background:#171524;border:1px solid #bfa27366;border-radius:16px;padding:12px;margin:14px 0}.visual svg{display:block;width:100%;height:auto;max-height:340px}.visual-caption{font-size:.88rem;color:#ead7b7;text-align:center;margin:8px 0 0}.view-toggle{margin:12px 0}.view-toggle .btn[aria-pressed="true"]{background:#d9b87d;color:#281e31}.quote{background:#1e192b;border-left:4px solid #d7b579;border-radius:12px;padding:16px;margin:13px 0;font-size:1.12rem}.options{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:10px;margin:15px 0}.option{padding:15px;text-align:left;border:1px solid #8b7592;background:#3c304a;color:#f6eadc;border-radius:12px}.option.selected{background:#625077;border:2px solid #f0c987;padding:14px}.result{padding:14px;background:#473c51;border-radius:12px;margin:12px 0}.feedback{color:#f5d79d}.question{background:#49364e;border:1px solid #a68888;border-radius:15px;padding:18px;margin:18px 0}.question strong{color:#f8d998}.steps{display:flex;gap:8px;flex-wrap:wrap;margin:15px 0}.step{font-size:.8rem;border-radius:50px;padding:5px 11px;border:1px solid #7e6b86;color:#e6d5df}.step.active{background:#d9b87d;color:#2d2031}.teacher{background:#263e3d;border:1px solid #83aca1;border-radius:13px;padding:15px;margin:12px 0}.teacher h3{margin:0 0 8px;color:#ccebdc}.footer{text-align:center;margin-top:45px;color:#baa9c3;font-size:.8rem}.hidden{display:none!important}.toast{padding:10px;border-radius:10px;background:#3c5146;color:#f3ffef;margin-top:12px}a{color:#f7d697}@media(max-width:750px){.grid{grid-template-columns:repeat(2,minmax(0,1fr))}.shell{padding:15px 13px 60px}.room{min-height:170px;padding:16px}.checkgrid{grid-template-columns:repeat(2,1fr)}}@media(max-width:470px){.grid,.options{grid-template-columns:1fr}.hero{padding:20px 4px}.room{min-height:unset}.top{align-items:flex-start}}
.custom-image{display:block;width:100%;max-height:420px;object-fit:contain;border-radius:12px}.image-manager-row{display:grid;grid-template-columns:1fr auto;gap:10px;align-items:center;margin:12px 0}.image-manager-row input{max-width:100%}.image-preview{width:180px;max-height:110px;object-fit:cover;border-radius:8px}.image-manager-controls{display:flex;gap:8px;flex-wrap:wrap}.image-manager-controls button{font-size:.85rem}.field textarea{background:#1e192a;border:1px solid #a990a3;color:#fff5df;border-radius:10px;padding:10px;width:100%;font:inherit;resize:vertical}
.interactive-card{background:#211b30;border:1px solid #a88baf;border-radius:14px;padding:14px;margin:10px 0}.interactive-card[draggable="true"]{cursor:grab}.interactive-card.chosen{outline:3px solid #edc881}.dropzone{min-height:100px;border:2px dashed #ae8aaf;border-radius:15px;padding:12px;background:#362a44}.dropzone.over{background:#59446a}.tile{border:1px solid #a88baf;background:#453550;color:#fff2da;border-radius:9px;padding:9px 12px;margin:4px;cursor:pointer}.tile.active{background:#9c7aa7}.chip{display:inline-block;background:#554266;border-radius:8px;padding:6px 10px;margin:3px}.passage{font-size:1.08rem;line-height:2}.passage button{background:transparent;color:#f9edcf;border:0;border-bottom:2px dotted #c9a87b;padding:2px 4px}.passage button.marked{background:#8e6c43;border-radius:5px}.builder{display:flex;flex-wrap:wrap;gap:7px;min-height:58px}.interactive-tools{display:flex;gap:8px;flex-wrap:wrap;margin:14px 0}.interact-select{padding:9px;border-radius:10px;background:#211b30;color:#f8eacf;border:1px solid #bca178}</style><style id="cafe-expansion-style">.cafe-section{max-width:1050px;margin:24px auto}.cafe-toolbar{display:flex;flex-wrap:wrap;gap:9px;margin:12px 0 20px}.cafe-toolbar button{flex:0 0 auto}.cafe-editor{width:100%;min-height:130px;padding:13px;background:#1e192a;color:#fff4de;border:1px solid #9e85a9;border-radius:12px;font:inherit;resize:vertical}.cafe-two{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:14px}.cafe-tile{background:#362c43;border:1px solid #9b7e9e;border-radius:14px;padding:17px}.cafe-tile h3{color:#f1d39b;margin:0 0 8px}.cafe-tile p{margin:6px 0}.cafe-note{font-size:.86rem;color:#dfcbd9}.cafe-field{display:block;width:100%;padding:10px;background:#1e192a;color:#fff4de;border:1px solid #9e85a9;border-radius:9px;font:inherit}.cafe-step{border-left:3px solid #d9b87d;padding:10px 14px;background:#342b42;margin:10px 0}.cafe-display{font-size:1.13rem}.cafe-hidden{display:none!important}@media(max-width:650px){.cafe-two{grid-template-columns:1fr}}</style>
<style id="cafePersistentTimerStyle">#cafeGlobalTimer{position:fixed;right:12px;bottom:14px;z-index:9999;background:#241b35;color:#f8f0dc;border:1px solid #d4ad6c;border-radius:14px;box-shadow:0 7px 26px #0009;padding:10px;min-width:180px;max-width:calc(100vw - 24px);font-family:Georgia,serif}#cafeGlobalTimer button{cursor:pointer;background:#3c3150;color:#fff3d9;border:1px solid #b49a70;border-radius:9px;padding:7px 9px;font:inherit;font-size:13px}#cafeGlobalTimer .cafe-timer-head{display:flex;align-items:center;justify-content:space-between;gap:14px;font-size:14px}#cafeGlobalTimer .cafe-timer-head button{padding:2px 9px}#cafeGlobalTimer .cafe-timer-clock{text-align:center;font-size:32px;font-variant-numeric:tabular-nums;margin:8px 0;color:#f6dca0}#cafeGlobalTimer .cafe-timer-buttons{display:flex;gap:5px;flex-wrap:wrap;justify-content:center}#cafeGlobalTimer:has(.cafe-timer-pill){padding:0;min-width:0;border-radius:30px}#cafeGlobalTimer .cafe-timer-pill{border:0;border-radius:30px;padding:10px 14px;background:#241b35;font-variant-numeric:tabular-nums}@media(max-width:500px){#cafeGlobalTimer{right:8px;bottom:8px}}</style>

'use strict';
const rooms=[['🌿','The Enchanted Story Garden','Figurative language · central idea · theme · hyphens · setting and mood'],['🪶','The Research & Remedy Room','Informative problem–solution writing conference'],['🧪','The Persuasion Parlor','Fallacies · purpose · perspective · allusions · comparing authors'],['⚙️','The Great Debate Workshop','Argumentative writing conference: humans vs. machines'],['📖','The Storybook Sanctuary','Short stories · summary · conflict · characters · theme · poetry'],['🕰️','The Storyteller’s Studio','Narration and narrative techniques']];
const activities=[
{title:'Mirror of Comparisons',icon:'🪞',skill:'Similes and metaphors',intro:'Examine the enchanted garden descriptions.',prompt:'“The moon was a silver coin above the garden.”',question:'What type of figurative language is used?',options:['Simile','Metaphor','Neither'],answer:1,why:'A metaphor directly compares the moon to a silver coin without using like or as.',talk:'What two things are compared? What picture does the comparison create for the reader?',apply:'Create a simile that describes the same moon. How is your comparison different?',hint:'Look for a comparison that does not use like or as.',variants:[['“The leaves danced like tiny emerald flags in the wind.”','What type of figurative language is used?',['Simile','Metaphor','Neither'],0,'Like introduces a comparison between leaves and flags.'],['“The old oak was a guardian at the garden gate.”','What type of figurative language is used?',['Simile','Metaphor','Neither'],1,'The oak is directly described as a guardian.']]},
{title:'The Central Idea Tree',icon:'🌳',skill:'Central idea',intro:'Read the informational passage and choose the central idea.',prompt:'“City gardens provide more than beautiful spaces. They give pollinators food, help cool neighborhoods, and offer residents places to grow vegetables. Even small gardens can benefit the community.”',question:'Which statement best expresses the central idea?',options:['Gardens always grow vegetables.','City gardens benefit communities in several ways.','Pollinators only live in cities.'],answer:1,why:'The passage describes several different benefits of city gardens; the central idea includes them all.',talk:'Which two details from the passage support the central idea? Why is a single detail not the central idea?',apply:'Give the passage a heading that communicates its central idea.',hint:'Choose the idea that covers the whole passage, not just one fact.',variants:[['“Public libraries lend books, but they also offer internet access, workshops, and quiet places to study. These services help people of many ages learn.”','Which is the best central idea?',['Libraries only lend books.','Libraries support learning through many services.','Workshops are always quiet.'],1,'All the examples show how libraries help people learn.']]},
{title:'The Growing Theme',icon:'🌱',skill:'Theme development',intro:'Follow the events in this miniature story.',prompt:'“Mira failed to grow her first seedlings. She wanted to abandon the garden, but her grandfather encouraged her to try again. She adjusted the sunlight and watering. Weeks later, green shoots appeared, and Mira smiled at what patience had made possible.”',question:'Which theme is best supported by the events?',options:['Gardens need sunlight.','Persistence can lead to growth.','Grandparents know everything.'],answer:1,why:'Mira faces failure, makes changes, persists, and eventually succeeds. The events develop the theme of persistence.',talk:'How does Mira change from the beginning to the end? Which event most strongly develops the theme?',apply:'Suggest another event that would reinforce the same theme.',hint:'A theme is a message about life, not just the topic of gardening.',variants:[['“Jon was afraid to perform. He practiced in small groups, then volunteered to read a poem aloud. His voice shook, but he finished and felt proud.”','Which theme is best supported?',['Courage can mean acting despite fear.','Poetry is always easy.','Performers never feel nervous.'],0,'Jon acts even though he remains afraid.']]},
{title:'The Hyphen Spell',icon:'✨',skill:'Hyphens',intro:'Help the café repair its enchanted signs.',prompt:'“Try our freshly baked, sugar free cookies!”',question:'Which revision correctly uses a hyphen in the compound modifier?',options:['Try our freshly-baked, sugar free cookies!','Try our freshly baked, sugar-free cookies!','Try our freshly baked, sugar free-cookies!'],answer:1,why:'Sugar-free is a compound modifier before cookies. An -ly adverb such as freshly does not typically take a hyphen with the participle it modifies.',talk:'Why is sugar-free hyphenated here? Why is freshly baked not hyphenated?',apply:'Use a correctly hyphenated compound modifier in your own café advertisement.',hint:'Look for two words that work together to describe a noun before it.',variants:[['“The cafe displayed a well known recipe.”','Which revision is correct?',['The cafe displayed a well-known recipe.','The cafe displayed a well known-recipe.','The cafe displayed a wellknown recipe.'],0,'Well-known modifies recipe before the noun.']]},
{title:'The Mood Changer',icon:'🌧️',skill:'Setting and mood',intro:'Read the description and notice the sensory details.',prompt:'“The empty café creaked as rain struck the dark windows. A single candle flickered, casting long shadows across the floor.”',question:'What mood do the setting details most strongly create?',options:['Playful and cheerful','Tense and eerie','Peaceful and sunny'],answer:1,why:'Creaking, dark windows, flickering light, and long shadows create an uneasy atmosphere.',talk:'Which words or images establish the mood? How does the setting influence the reader’s feelings?',apply:'Change two details to make the same café feel welcoming instead.',hint:'Imagine how you would feel if you were standing in this setting.',variants:[['“Golden sunlight spilled across the café tables. Warm cinnamon scented the air as friends laughed by the window.”','What mood is created?',['Warm and welcoming','Threatening and eerie','Lonely and hopeless'],0,'Sunlight, cinnamon, and laughter establish a cozy mood.']]}
];
const moduleSkills = {"2":[{"icon":"🪶","title":"Thesis Workshop","skill":"Informative thesis","intro":"Read the example, choose an answer, and explain your thinking aloud.","examples":[{"prompt":"Vultures remove animal remains from ecosystems. When their numbers decline, carcasses may remain longer and create sanitation problems.","question":"Which thesis best introduces a problem-and-solution essay?","options":["Vultures are birds that can fly.","Declining vulture populations create sanitation challenges that communities can address through conservation.","All birds are equally important."],"answer":1,"why":"The thesis names the problem and previews a response."},{"prompt":"Feral swine uproot native plants and damage farms as they search for food. Communities use several approaches to limit the harm.","question":"Which thesis best introduces a problem-and-solution essay?","options":["Feral swine are interesting animals.","Feral swine damage ecosystems and agriculture, so communities need coordinated management strategies.","Every farm has feral swine."],"answer":1,"why":"The thesis identifies a problem and a general solution direction."}]},{"icon":"🔍","title":"Find the Causes","skill":"Problem causes","intro":"Read the example, choose an answer, and explain your thinking aloud.","examples":[{"prompt":"Some vulture populations decline because of poisoning, habitat pressures, and collisions with infrastructure.","question":"Which detail identifies a cause of the problem?","options":["Vultures are scavengers.","Poisoning and habitat pressures reduce vulture populations.","A community might protect nesting sites."],"answer":1,"why":"These pressures contribute to the decline."},{"prompt":"Feral swine populations spread rapidly partly because they reproduce quickly and have few effective natural controls in many areas.","question":"Which detail identifies a cause of the problem?","options":["Feral swine can be destructive.","Rapid reproduction helps feral swine populations expand.","Farmers may build protective fencing."],"answer":1,"why":"Fast reproduction helps explain population growth."}]},{"icon":"🌿","title":"Ripple Effects","skill":"Impacts and consequences","intro":"Read the example, choose an answer, and explain your thinking aloud.","examples":[{"prompt":"When fewer vultures remove carcasses, decomposing remains may persist longer in some areas.","question":"Which statement describes an effect rather than a cause or solution?","options":["Conservation groups protect vultures.","Animal remains may persist longer.","Vultures face poisoning."],"answer":1,"why":"This is a consequence of fewer scavengers."},{"prompt":"When feral swine root through wetlands, they can disturb soil and damage native vegetation.","question":"Which statement describes an effect rather than a cause or solution?","options":["Feral swine reproduce quickly.","Wetland vegetation is damaged.","Managers install barriers."],"answer":1,"why":"Damaged vegetation is an environmental consequence."}]},{"icon":"🛠️","title":"Solution Station","skill":"Evaluating solutions","intro":"Read the example, choose an answer, and explain your thinking aloud.","examples":[{"prompt":"A conservation team wants to reduce accidental poisoning of vultures. It proposes public education and safer disposal of toxic substances.","question":"Which response best addresses the stated problem?","options":["Add more litter bins in the library.","Educate communities about poisoning risks and safer disposal.","Ignore the issue until it disappears."],"answer":1,"why":"The action directly targets a cause of decline."},{"prompt":"A rural county wants to reduce feral swine damage. It proposes coordinated, lawful management with landowners and habitat monitoring.","question":"Which response best addresses the stated problem?","options":["Coordinate management with landowners and monitor damage.","Plant only decorative flowers.","Wait for all swine to leave on their own."],"answer":0,"why":"Coordinated management addresses the stated impact."}]},{"icon":"📚","title":"Essay Architect","skill":"Informative organization","intro":"Read the example, choose an answer, and explain your thinking aloud.","examples":[{"prompt":"An essay introduces declining vultures, explains causes, describes sanitation impacts, and evaluates conservation responses.","question":"Which organization best supports a problem-and-solution essay?","options":["Solutions, unrelated anecdote, title","Problem, causes and effects, possible solutions, conclusion","Conclusion, unrelated facts, problem"],"answer":1,"why":"The structure helps readers understand the problem before the response."},{"prompt":"An essay introduces feral swine damage, explains population growth, describes impacts on farms, and presents management responses.","question":"Which organization best supports a problem-and-solution essay?","options":["Problem, causes and effects, management responses, conclusion","Unrelated animal facts, personal opinion, ending","Solutions only, without explaining the problem"],"answer":0,"why":"The sequence establishes the issue and supports proposed responses."}]}],"3":[{"icon":"🧪","title":"Fallacy Detective","skill":"Logical fallacies","intro":"Read the example, choose an answer, and explain your thinking aloud.","examples":[{"prompt":"A speaker says, “Everyone at school likes this app, so it must be the best learning tool.”","question":"What reasoning problem appears in the statement?","options":["Bandwagon appeal","Cause-and-effect evidence","Balanced comparison"],"answer":0,"why":"Popularity alone does not prove quality."},{"prompt":"A speaker says, “You should ignore her recycling argument because she wears old shoes.”","question":"What reasoning problem appears in the statement?","options":["Personal attack (ad hominem)","Relevant supporting evidence","A fair counterclaim"],"answer":0,"why":"The attack targets the person rather than the argument."}]},{"icon":"🎯","title":"Purpose Compass","skill":"Author’s purpose","intro":"Read the example, choose an answer, and explain your thinking aloud.","examples":[{"prompt":"A brochure lists steps families can take to conserve water at home.","question":"What is the author’s primary purpose?","options":["To inform readers about water conservation","To entertain with a fictional story","To argue that water does not matter"],"answer":0,"why":"The brochure provides practical information."},{"prompt":"An editorial urges the city council to create safer bicycle routes.","question":"What is the author’s primary purpose?","options":["To persuade officials to improve bicycle safety","To describe a fantasy adventure","To explain a recipe"],"answer":0,"why":"The editorial advocates a particular action."}]},{"icon":"🪞","title":"Perspective Window","skill":"Author’s perspective","intro":"Read the example, choose an answer, and explain your thinking aloud.","examples":[{"prompt":"An author calls the new park “a welcome refuge for busy families.”","question":"Which statement best describes the author’s perspective?","options":["The author feels positively about the park.","The author dislikes all families.","The author has no opinion."],"answer":0,"why":"The positive language reveals approval."},{"prompt":"An author describes a proposed shopping center as “a troubling loss of green space.”","question":"Which statement best describes the author’s perspective?","options":["The author is concerned about the development.","The author celebrates the loss of green space.","The author is writing without a viewpoint."],"answer":0,"why":"The word troubling signals concern."}]},{"icon":"🏛️","title":"Allusion Gallery","skill":"Literary allusions","intro":"Read the example, choose an answer, and explain your thinking aloud.","examples":[{"prompt":"After solving the difficult puzzle, Ana joked that she felt like Sherlock Holmes.","question":"What does the allusion add?","options":["It suggests sharp detective-like reasoning.","It proves Ana is a fictional detective.","It explains where the puzzle was purchased."],"answer":0,"why":"The familiar detective reference suggests observation and deduction."},{"prompt":"When he faced an enormous challenge, Malik called it his Mount Everest.","question":"What does the allusion add?","options":["It emphasizes how enormous the challenge feels.","It means he climbed a mountain.","It proves the task is easy."],"answer":0,"why":"The mountain reference communicates scale and difficulty."}]},{"icon":"⚖️","title":"Two Voices","skill":"Comparing authors","intro":"Read the example, choose an answer, and explain your thinking aloud.","examples":[{"prompt":"Author A describes school gardens as hands-on science classrooms. Author B argues gardens also build community relationships.","question":"How do the authors differ?","options":["A emphasizes learning; B emphasizes community.","Both say gardens have no value.","A writes about sports; B writes about music."],"answer":0,"why":"Each writer emphasizes a different benefit."},{"prompt":"Author A praises online classes for flexible schedules. Author B worries some students need more face-to-face support.","question":"How do the authors differ?","options":["A emphasizes flexibility; B emphasizes support needs.","Both reject online learning entirely.","Neither discusses education."],"answer":0,"why":"The authors focus on different considerations."}]}],"4":[{"icon":"⚙️","title":"Claim Forge","skill":"Argumentative claim","intro":"Read the example, choose an answer, and explain your thinking aloud.","examples":[{"prompt":"A student is writing about whether machines or humans are more beneficial in workplaces.","question":"Which claim is most defensible?","options":["Machines and humans both exist.","Machines are more beneficial for repetitive workplace tasks because they improve consistency and efficiency.","Workplaces are places where people work."],"answer":1,"why":"The claim takes a position and gives a reason."},{"prompt":"A student wants to argue that human judgment remains essential even when machines handle routine tasks.","question":"Which claim is most defensible?","options":["Human judgment remains essential for complex workplace decisions because people can weigh context and ethical concerns.","Humans have hands.","Machines are made of materials."],"answer":0,"why":"The claim takes a clear position supported by a rationale."}]},{"icon":"📊","title":"Evidence Lab","skill":"Relevant evidence","intro":"Read the example, choose an answer, and explain your thinking aloud.","examples":[{"prompt":"A writer argues machines can complete repetitive tasks consistently.","question":"Which evidence would best support the claim?","options":["A study comparing error rates on repetitive tasks.","A list of popular robot movies.","A personal preference for blue machines."],"answer":0,"why":"Comparative performance data directly tests the claim."},{"prompt":"A writer argues humans are important for customer-facing jobs that require empathy.","question":"Which evidence would best support the claim?","options":["Customer feedback describing effective human support in complex situations.","A chart of cafeteria menus.","A list of machine colors."],"answer":0,"why":"Relevant customer experiences support the role of empathy."}]},{"icon":"🧱","title":"Reason Builder","skill":"Connecting reasons","intro":"Read the example, choose an answer, and explain your thinking aloud.","examples":[{"prompt":"Claim: Machines can improve efficiency in some workplaces. Evidence: Automated systems can process large sets of routine entries quickly.","question":"Which reasoning best connects evidence to the claim?","options":["Fast routine processing can free employees for other tasks.","All machines are friendly.","Speed never matters."],"answer":0,"why":"It explains how the evidence supports efficiency."},{"prompt":"Claim: Human workers remain vital in unpredictable situations. Evidence: People can adapt when a customer presents an unusual problem.","question":"Which reasoning best connects evidence to the claim?","options":["Adaptability helps workers respond to situations that scripts cannot anticipate.","All customers want the same thing.","Unexpected problems never occur."],"answer":0,"why":"It explains why adaptability supports the claim."}]},{"icon":"🔄","title":"Counterclaim Corner","skill":"Counterclaims and rebuttals","intro":"Read the example, choose an answer, and explain your thinking aloud.","examples":[{"prompt":"Claim: Machines are more efficient for repetitive work. Counterclaim: Automation can require expensive setup and maintenance.","question":"Which response acknowledges and answers the counterclaim?","options":["Setup costs matter, but long-term time savings may offset them in some settings.","Costs do not exist.","Anyone who disagrees is wrong."],"answer":0,"why":"It concedes a limitation and provides a reasoned response."},{"prompt":"Claim: Humans are better for complex interpersonal decisions. Counterclaim: Software can support decisions by analyzing information rapidly.","question":"Which response acknowledges and answers the counterclaim?","options":["Fast analysis is useful, but people must still interpret results in context.","Computers are always wrong.","There is no counterclaim."],"answer":0,"why":"It recognizes a strength while defending the original claim."}]},{"icon":"📝","title":"Debate Blueprint","skill":"Essay structure","intro":"Read the example, choose an answer, and explain your thinking aloud.","examples":[{"prompt":"A student plans an argument favoring machines for repetitive work.","question":"Which plan best organizes the argument?","options":["Claim, reasons and evidence, counterclaim and rebuttal, conclusion","Counterclaim only, no evidence","Unrelated examples, conclusion, claim"],"answer":0,"why":"The plan develops and tests the argument."},{"prompt":"A student plans an argument favoring humans for tasks requiring empathy and judgme if(d.type==='build'){const pool=[...d.cards,...d.distractors];body=`<p class="muted">Select the tiles in the order you want to use them.</p><div class="dropzone builder">${state.built.map(i=>`<span class="chip">${esc(pool[i])}</span>`).join('')}</div><div>${pool.map((c,i)=>state.built.includes(i)?'':`<button class="tile" data-build="${i}">${esc(c)}</button>`).join('')}</div><button class="btn ghost" id="undoBuild">↶ Undo last</button>`;}

const prompt= d.oralPrompt || (d.type==='sort'?'Why does each card belong in its category?':d.type==='sequence'?'How does this sequence develop the meaning or structure?':d.type==='highlight'?'Which highlighted detail is strongest, and why?':d.type==='build'?'Explain your choices and revise one element aloud.':'What did your choices reveal about the skill?');
app.innerHTML=`<section class="challenge"><div class="actions"><button class="btn ghost" id="interBack">← ${module===1?'All Challenges':'Module Room'}</button><span class="small">Module ${module} · ${esc(d.skill)}</span></div><div class="panel" style="margin-top:16px"><div class="eyebrow">✨ Interactive Challenge</div><h2>${esc(d.name)}</h2><p>${esc(d.instruction)}</p><div class="interactive-tools"><label for="interactiveSelect" class="small">Activity:</label><select class="interact-select" id="interactiveSelect">${interactionLibrary[module].map((x,i)=>`<option value="${i}" ${i===interactiveIndex?'selected':''}>${esc(x.name)}</option>`).join('')}</select></div>${body}<div class="actions" style="margin-top:18px"><button class="btn secondary" id="checkInteract">🔎 Check My Work</button><button class="btn ghost" id="resetInteract">↻ Reset</button></div>${state.reveal?`<div class="result" role="status">${interactionFeedback(d,state)}<p><strong>Explain aloud:</strong> ${esc(prompt)}</p></div>`:''}<div class="question"><strong>💬 Explain Your Thinking</strong><p>${esc(prompt)}</p><strong>✨ Apply It</strong><p>Give a new example of this skill and explain how it works.</p></div></div></section>`;

if(d.type==='sequence'){app.querySelectorAll('[data-seq]').forEach(el=>el.onclick=()=>{state.order.push(Number(el.dataset.seq));state.reveal=false;renderInteract()});document.getElementById('undoSeq').onclick=()=>{state.order.pop();state.reveal=false;renderInteract()}}

}
function interactionFeedback(d,s){let correct=0,total=0;if(d.type==='sort'){total=d.cards.length;correct=d.cards.filter((c,i)=>s.placed[i]!==undefined&&d.bins[s.placed[i]]===c[1]).length}if(d.type==='sequence'){total=d.cards.length;correct=s.order.filter((v,i)=>v===i).length}if(d.type==='highlight'){total=d.segments.filter(x=>x[1]==='yes').length;correct=d.segments.filter((x,i)=>x[1]==='yes'&&s.marked[i]).length;const extra=d.segments.filter((x,i)=>x[1]!=='yes'&&s.marked[i]).length;return `Relevant details selected: ${correct}/${total}. ${extra?'Review '+extra+' unrelated selection(s).':'No unrelated selections.'}`}if(d.type==='build'){total=d.cards.length;correct=s.built.filter((v,i)=>v===i).length}if(d.type==='path')return `You explored ${s.answers.filter(x=>x!==undefined).length} of ${d.steps.length} decisions. Discuss the reasoning behind each choice.`;return `${correct} of ${total} correctly placed or ordered. ${correct===total?'Great! Explain why the arrangement works.':'Try revising and checking again.'}`}

function cafeResourceManager(){if(studentLink||mode!=='teacher')return;route='resources';updateTop();app.innerHTML=`<section class="panel setup"><div class="eyebrow">Behind the counter</div><h2 class="heading">📎 Café Resource Manager</h2><p>Upload images or PDFs for Writing Bites, Reading Refills, or the Teacher's Toolkit. Assign a lesson or choose All Topics. Export the website ZIP after making changes.</p><div class="field"><label for="resourceSection">Destination</label><select id="resourceSection"><option value="writing">✒️ Writing Bites</option><option value="reading">📚 Reading Refills</option><option value="toolkit">🗝️ Teacher's Toolkit</option></select></div><div class="field"><label for="resourceSkill">Lesson / topic</label><select id="resourceSkill"></select></div><div class="field"><label for="resourceTitle">Resource title</label><input id="resourceTitle" placeholder="e.g., Counterclaim anchor chart"></div><div class="field"><label for="resourceDescription">Optional description</label><textarea id="resourceDescription" rows="2"></textarea></div><div class="field"><label for="resourceFile">Image or PDF (PNG, JPG, WebP, PDF)</label><input id="resourceFile" type="file" accept="image/png,image/jpeg,image/webp,application/pdf"></div><div class="field"><label><input type="checkbox" id="resourcePrivate"> Teacher-only (hide from student view)</label></div><div class="actions"><button class="btn" id="resourceAdd">＋ Add resource</button><button class="btn secondary" id="resourceExport">⬇ Export website ZIP</button><button class="btn ghost" id="resourceBack">← Teacher Setup</button></div><div class="notice" id="resourceStatus">Uploads are draft changes until you export and publish the ZIP. Avoid student-identifying information.</div><h3>Saved resources</h3><div id="resourceList"></div></section>`;
const sec=document.getElementById('resourceSection'),skill=document.getElementById('resourceSkill'),status=document.getElementById('resourceStatus');function refreshSkills(){const a=sec.value==='writing'?cafeWriting:sec.value==='reading'?cafeReading:[];skill.innerHTML='<option value="all">All Topics</option>'+a.map(x=>`<option value="${esc(x.id)}">${esc(x.name)}</option>`).join('')}function refreshList(){const list=document.getElementById('resourceList');list.innerHTML=cafeResources.length?cafeResources.map(r=>`<div class="cafe-tile" style="margin:10px 0"><strong>${esc(r.title)}</strong> <span class="small">${esc(r.section)} · ${esc(r.skill)}${r.teacherOnly?' · teacher only':''}</span><div class="actions"><button class="btn secondary" data-open-resource="${esc(r.id)}">Preview</button><button class="btn ghost" data-delete-resource="${esc(r.id)}">Remove</button></div></div>`).join(''):'<p class="cafe-note">No uploaded resources yet.</p>';wireResourceOpen(list);list.querySelectorAll('[data-delete-resource]').forEach(b=>b.onclick=()=>{if(confirm('Remove this resource from the next export?')){const i=cafeResources.findIndex(r=>r.id===b.dataset.deleteResource);if(i>=0)cafeResources.splice(i,1);refreshList();status.textContent='Resource removed from draft. Export to publish.'}})}sec.onchange=refreshSkills;refreshSkills();refreshList();document.getElementById('resourceBack').onclick=setup;document.getElementById('resourceExport').onclick=exportImages;document.getElementById('resourceAdd').onclick=async()=>{const f=document.getElementById('resourceFile').files[0],title=document.getElementById('resourceTitle').value.trim();if(!f||!title){status.textContent='Choose a file and enter a title.';return}if(!['image/png','image/jpeg','image/webp','application/pdf'].includes(f.type)){status.textContent='Use a PNG, JPG, WebP, or PDF.';return}if(f.size>15*1024*1024){status.textContent='Please keep individual resources under 15 MB.';return}const data=await readImage(f);cafeResources.push({id:'r'+Date.now().toString(36)+Math.random().toString(36).slice(2,7),section:sec.value,skill:skill.value,title,description:document.getElementById('resourceDescription').value.trim(),teacherOnly:document.getElementById('resourcePrivate').checked||sec.value==='toolkit',type:f.type,data,path:''});document.getElementById('resourceFile').value='';document.getElementById('resourceTitle').value='';document.getElementById('resourceDescription').value='';refreshList();status.textContent='Resource added to draft. Export ZIP to save and publish.'}}
function cafeLibrary(kind){const isWrite=kind==='writing',items=isWrite?cafeWriting:cafeReading;cafeHead(isWrite?'✒️ Writing Bites':'📚 Reading Refills',isWrite?'Bite-sized writing practice · See It → Fix It → Try It':'Quick reading strategies you can use with any passage.');const area=document.getElementById('cafeContent');area.innerHTML=`<div class="panel"><label for="cafeSearch">Find a skill</label><input class="cafe-field" id="cafeSearch" placeholder="Search by skill name…"><div id="cafeResults" class="cafe-two" style="margin-top:16px"></div></div>`;const show=()=>{const q=document.getElementById('cafeSearch').value.toLowerCase(),results=document.getElementById('cafeResults');results.innerHTML='';items.filter(x=>x.name.toLowerCase().includes(q)).forEach(x=>{const tile=document.createElement('div');tile.className='cafe-tile';tile.innerHTML=`<h3>${esc(x.name)}</h3><p class="cafe-note">${esc(isWrite?x.tip:x.strategy)}</p>`;tile.append(cafeButton('Open mini-lesson →',()=>cafeLesson(kind,x.id)));results.append(tile)});if(!results.children.length)results.textContent='No matching skills yet.'};document.getElementById('cafeSearch').oninput=show;show()}
function cafeLesson(kind,id){const isWrite=kind==='writing',item=(isWrite?cafeWriting:cafeReading).find(x=>x.id===id);if(!item)return cafeLibrary(kind);cafeHead(`${isWrite?'✒️':'📚'} ${esc(item.name)}`,isWrite?'A short teacher-led writing workshop':'A reading strategy for any passage');const area=document.getElementById('cafeContent');if(isWrite){area.innerHTML=`<div class="panel"><div class="cafe-toolbar"><button class="btn ghost" id="cafeList">← All Writing Bites</button><button class="btn secondary" id="cafeGuide">Show Teacher Guidance</button></div><div class="cafe-step"><strong>1 · See It</strong><p>${esc(item.model)}</p></div><div class="cafe-step"><strong>2 · Fix It</strong><p>${esc(item.weak)}</p><p class="cafe-note">How would you strengthen this example?</p></div><div class="cafe-step"><strong>3 · Try It</strong><p>${esc(item.task)}</p><textarea class="cafe-editor" placeholder="Optional practice space (not saved)"></textarea></div><div id="cafeGuideText" class="teacher hidden"><strong>Teacher coaching:</strong> ${esc(item.tip)}</div></div>`;document.getElementById('cafeList').onclick=()=>cafeLibrary('writing');document.getElementById('cafeGuide').onclick=()=>document.getElementById('cafeGuideText').classList.toggle('hidden')}else{area.innerHTML=`<div class="panel"><div class="cafe-toolbar"><button class="btn ghost" id="cafeList">← All Reading Refills</button><button class="btn secondary" id="cafeGuide">Show Teacher Prompts</button></div><div class="cafe-step"><strong>Strategy</strong><p>${esc(item.strategy)}</p></div><div class="cafe-step"><strong>Guided Practice</strong><p>${esc(item.tryit)}</p></div><div id="cafeGuideText" class="teacher hidden"><strong>Ask aloud:</strong> ${esc(item.prompt)}</div><label for="cafePassage">Paste a passage (optional)</label><textarea id="cafePassage" class="cafe-editor" placeholder="Paste text here for screen-sharing…"></textarea></div>`;document.getElementById('cafeList').onclick=()=>cafeLibrary('reading');document.getElementById('cafeGuide').onclick=()=>document.getElementById('cafeGuideText').classList.toggle('hidden')}}
function cafeTutoring(){cafeHead('☕ The Tutoring Table','A flexible workspace for whatever a student needs help with today.');document.getElementById('cafeContent').innerHTML=`<div class="panel"><div class="cafe-two"><div><label for="tutorTopic">Student question / learning goal</label><textarea class="cafe-editor" id="tutorTopic" placeholder="What are we working on?"></textarea></div><div><label for="tutorText">Assignment or passage</label><textarea class="cafe-editor" id="tutorText" placeholder="Paste directions, a passage, or a draft…"></textarea></div></div><label for="tutorWork">Work it out together</label><textarea class="cafe-editor" id="tutorWork" placeholder="Model, brainstorm, revise, or practice here…"></textarea><div class="cafe-toolbar" id="tutorActions"><button class="btn ghost" id="tutorClear">Clear Workspace</button></div><div class="notice">This workspace is temporary. Text is not submitted or saved by the café. Avoid entering personal student information.</div></div>`;document.getElementById('tutorClear').onclick=()=>{if(confirm('Clear all three tutoring fields?'))['tutorTopic','tutorText','tutorWork'].forEach(id=>document.getElementById(id).value='')};document.getElementById('tutorActions').append(cafeButton('✒️ Writing Bites',()=>cafeLibrary('writing')),cafeButton('📚 Reading Refills',()=>cafeLibrary('reading')))}
function cafeSpecials(){cafeHead('✨ Daily Specials Board','Feature one useful skill. Change it when you want—not every day.');const item=(cafeSpecial.type==='reading'?cafeReading:cafeWriting).find(x=>x.id===cafeSpecial.id)||cafeWriting[0];const area=document.getElementById('cafeContent');area.innerHTML=`<div class="panel"><div class="eyebrow">Today’s featured skill</div><h2 class="heading">${esc(item.name)}</h2><p>${esc(cafeSpecial.message)}</p><div class="cafe-toolbar" id="specialActions"></div>${mode==='teacher'?`<div class="cafe-tile"><h3>Behind the counter · Edit the special</h3><label>Featured resource</label><select class="cafe-field" id="specialChoice">${[...cafeWriting.map(x=>({type:'writing',...x})),...cafeReading.map(x=>({type:'reading',...x}))].map(x=>`<option value="${x.type}:${x.id}" ${cafeSpecial.type===x.type&&cafeSpecial.id===x.id?'selected':''}>${x.type==='writing'?'Writing Bite':'Reading Refill'} · ${esc(x.name)}</option>`).join('')}</select><label for="specialMessage">Optional announcement</label><textarea class="cafe-editor" id="specialMessage">${esc(cafeSpecial.message)}</textarea><div class="cafe-toolbar"><button class="btn" id="specialSave">Save Featured Skill</button></div><p class="cafe-note">Saved in this browser only. To publish the same special for everyone, we can add it to the exported website in a later phase.</p></div>`:''}</div>`;document.getElementById('specialActions').append(cafeButton('Open featured lesson →',()=>cafeLesson(cafeSpecial.type,cafeSpecial.id)));if(mode==='teacher')document.getElementById('specialSave').onclick=()=>{const [type,id]=document.getElementById('specialChoice').value.split(':');cafeSpecial={type,id,message:document.getElementById('specialMessage').value};try{localStorage.setItem('magicalCafeSpecialV1',JSON.stringify(cafeSpecial))}catch{}cafeSpecials()}}
function cafeToolkit(){cafeHead('🗝️ Teacher’s Café Toolkit','Fast access to your screen-share resources and teaching controls.');const area=document.getElementById('cafeContent');area.innerHTML=`<div class="panel"><div class="cafe-two" id="toolkitLinks"></div><div class="cafe-tile" style="margin-top:16px"><h3>⏱️ Café countdown timer</h3><p>Start a countdown here or from the floating timer. It stays running as you move between café rooms and DBA activities.</p><div class="cafe-toolbar"><button class="btn secondary" id="timer5">5 minutes</button><button class="btn secondary" id="timer10">10 minutes</button><button class="btn secondary" id="timerCustom">Custom time</button><button class="btn" id="timerOpen">Show timer</button></div><p class="cafe-note">The timer is teacher-only and can be minimized while screen-sharing. It also keeps its remaining time if you refresh this tab.</p></div><div class="notice">Teacher tips and answer guides are for instructional use, not secure answer storage. Use Focus View to reduce distractions while screen-sharing.</div></div>`;const links=document.getElementById('toolkitLinks');[['☕ Tutoring Table',()=>cafeTutoring()],['✒️ Writing Bites',()=>cafeLibrary('writing')],['📚 Reading Refills',()=>cafeLibrary('reading')],['✨ Daily Specials',()=>cafeSpecials()],['📖 DBA Practice Rooms',()=>lobby()],['⚙ Teacher Setup',()=>setup()]].forEach(([label,fn])=>{const tile=document.createElement('div');tile.className='cafe-tile';tile.append(cafeButton(label,fn));links.append(tile)});document.getElementById('timer5').onclick=()=>cafeTimerSet(300);document.getElementById('timer10').onclick=()=>cafeTimerSet(600);document.getElementById('timerCustom').onclick=cafeTimerCustom;document.getElementById('timerOpen').onclick=()=>cafeTimerShow(true)}

/* Persistent teacher-only countdown: independent of page/route rendering. */
const cafeTimerKey='magicalCafeTimerV2';
let cafeTimer={remaining:300,endAt:null,running:false,visible:false,expanded:true};
if(!studentLink){try{const saved=JSON.parse(sessionStorage.getItem(cafeTimerKey));if(saved&&Number.isFinite(saved.remaining))cafeTimer={...cafeTimer,...saved}}catch{}}
function cafeTimerRemaining(){return cafeTimer.running?Math.max(0,Math.ceil((cafeTimer.endAt-Date.now())/1000)):cafeTimer.remaining}
function cafeTimerSave(){if(!studentLink)try{sessionStorage.setItem(cafeTimerKey,JSON.stringify(cafeTimer))}catch{}}
function cafeTimerShow(open){if(studentLink)return;cafeTimer.visible=true;cafeTimer.expanded=open;cafeTimerSave();cafeTimerRender()}
function cafeTimerSet(seconds){if(studentLink)return;cafeTimer.remaining=seconds;cafeTimer.endAt=Date.now()+seconds*1000;cafeTimer.running=true;cafeTimer.visible=true;cafeTimer.expanded=true;cafeTimerSave();cafeTimerRender()}
function cafeTimerToggle(){if(cafeTimer.running){cafeTimer.remaining=cafeTimerRemaining();cafeTimer.running=false;cafeTimer.endAt=null}else{if(cafeTimer.remaining<=0)cafeTimer.remaining=300;cafeTimer.endAt=Date.now()+cafeTimer.remaining*1000;cafeTimer.running=true}cafeTimerSave();cafeTimerRender()}
function cafeTimerCustom(){const value=prompt('How many minutes? (1–120)','5');if(value===null)return;const n=Number(value);if(!Number.isFinite(n)||n<1||n>120){alert('Enter a number from 1 to 120.');return}cafeTimerSet(Math.round(n*60))}
function cafeTimerRender(){if(studentLink)return;let el=document.getElementById('cafeGlobalTimer');if(!el){el=document.createElement('aside');el.id='cafeGlobalTimer';el.setAttribute('aria-label','Café countdown timer');document.body.append(el)}const remaining=cafeTimerRemaining();if(cafeTimer.running&&remaining===0){cafeTimer.running=false;cafeTimer.remaining=0;cafeTimer.endAt=null;cafeTimerSave();if(!cafeTimer.notified){cafeTimer.notified=true;try{navigator.vibrate?.([160,100,160])}catch{}}}el.style.display=cafeTimer.visible?'block':'none';el.innerHTML=cafeTimer.expanded?`<div class="cafe-timer-head"><strong>⏱️ Café Timer</strong><button type="button" id="cafeTimerMin" aria-label="Minimize timer">−</button></div><div class="cafe-timer-clock" aria-live="off">${String(Math.floor(remaining/60)).padStart(2,'0')}:${String(remaining%60).padStart(2,'0')}</div><div class="cafe-timer-buttons"><button type="button" id="cafeTimerToggle">${cafeTimer.running?'Pause':remaining===0?'Restart':'Start'}</button><button type="button" id="cafeTimerReset">Reset</button><button type="button" id="cafeTimerFive">5m</button><button type="button" id="cafeTimerTen">10m</button></div>`:`<button type="button" id="cafeTimerExpand" class="cafe-timer-pill">⏱️ ${String(Math.floor(remaining/60)).padStart(2,'0')}:${String(remaining%60).padStart(2,'0')} ${cafeTimer.running?'▶':''}</button>`;if(cafeTimer.expanded){el.querySelector('#cafeTimerMin').onclick=()=>{cafeTimer.expanded=false;cafeTimerSave();cafeTimerRender()};el.querySelector('#cafeTimerToggle').onclick=cafeTimerToggle;el.querySelector('#cafeTimerReset').onclick=()=>{cafeTimer.running=false;cafeTimer.remaining=300;cafeTimer.endAt=null;cafeTimer.notified=false;cafeTimerSave();cafeTimerRender()};el.querySelector('#cafeTimerFive').onclick=()=>cafeTimerSet(300);el.querySelector('#cafeTimerTen').onclick=()=>cafeTimerSet(600)}else el.querySelector('#cafeTimerExpand').onclick=()=>cafeTimerShow(true)}
if(!studentLink){cafeTimer.visible=true;if(cafeTimer.running&&cafeTimerRemaining()===0){cafeTimer.running=false;cafeTimer.remaining=0}cafeTimerRender();setInterval(()=>{if(cafeTimer.visible)cafeTimerRender()},1000)}

const cafeOriginalLobby=lobby;
const cafeOriginalLesson=cafeLesson;cafeLesson=function(kind,id){cafeOriginalLesson(kind,id);addResourceShelf(kind,id)};
const cafeOriginalLibrary=cafeLibrary;cafeLibrary=function(kind){cafeOriginalLibrary(kind);addResourceShelf(kind,'all')};
const cafeOriginalToolkit=cafeToolkit;cafeToolkit=function(){cafeOriginalToolkit();addResourceShelf('toolkit','all');if(mode==='teacher'){const b=cafeButton('📎 Manage Café Resources',cafeResourceManager);document.getElementById('toolkitLinks').append(b)}};
const cafeOriginalSetupResources=setup;setup=function(){cafeOriginalSetupResources();if(!studentLink&&mode==='teacher'){const b=document.createElement('button');b.className='btn secondary';b.textContent='📎 Manage Café Resources';b.onclick=cafeResourceManager;app.querySelector('.setup')?.append(b)}};
lobby=function(){cafePresenter=false;document.querySelector('.top').classList.remove('cafe-hidden');document.querySelector('.footer').classList.remove('cafe-hidden');cafeOriginalLobby();const section=document.createElement('section');section.className='cafe-section';section.innerHTML=`<div class="eyebrow" style="margin:25px 0 8px">More from the café menu</div><h2 class="heading">☕ Help, practice & daily inspiration</h2><p class="muted">Teacher-led tools for tutoring and mini-lessons. Open an activity when you need it.</p><div class="grid" id="cafeMenu"></div>`;app.append(section);const menu=section.querySelector('#cafeMenu');[['☕','Tutoring Table','Flexible help workspace',()=>cafeTutoring()],['✒️','Writing Bites','Quick writing mini-lessons',()=>cafeLibrary('writing')],['📚','Reading Refills','Reusable reading strategies',()=>cafeLibrary('reading')],['✨','Daily Specials','Featured café skill',()=>cafeSpecials()],['🗝️','Teacher’s Toolkit','Teaching controls and quick links',()=>cafeToolkit()]].forEach(([icon,title,sub,fn])=>{if(title==='Teacher’s Toolkit'&&mode!=='teacher')return;const b=document.createElement('button');b.className='room';b.innerHTML=`<span class="emoji">${icon}</span><strong>${title}</strong><span>${sub}</span>`;b.onclick=fn;menu.append(b)})};

document.getElementById('homeBtn').onclick=lobby;document.getElementById('setupBtn').onclick=setup;updateTop();lobby();
</script></body></html>
