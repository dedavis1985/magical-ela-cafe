<!doctype html><html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><meta name="theme-color" content="#241b35"><title>Magical ELA Café | Visual DBA Playground</title><style>
:root{font-family:Georgia,'Times New Roman',serif;color:#f8f0dc;background:#171323}*{box-sizing:border-box}body{margin:0;min-height:100vh;background:radial-gradient(ellipse at 50% 0,#493458 0,#251c36 42%,#151321 100%);line-height:1.5}button,input,select{font:inherit}button{cursor:pointer}button:focus-visible,input:focus-visible{outline:3px solid #e7bd73;outline-offset:3px}.shell{max-width:1150px;margin:auto;padding:20px 22px 80px}.top{display:flex;align-items:center;justify-content:space-between;gap:15px;flex-wrap:wrap}.brand{font-size:1.05rem;color:#e8c991;letter-spacing:.07em}.small{font-size:.86rem;color:#d8c6d9}.pill{border:1px solid #c4a77666;border-radius:40px;padding:8px 13px;background:#32273c;color:#f6e9ce}.hero{text-align:center;padding:38px 15px 30px}.spark{font-size:2.5rem}.hero h1{font-size:clamp(2.5rem,6vw,4.5rem);line-height:1.08;margin:10px 0;color:#f6db9c;text-shadow:0 3px 25px #dfab5a55}.hero p{max-width:630px;margin:14px auto;color:#e3d4e5;font-size:1.05rem}.eyebrow{text-transform:uppercase;letter-spacing:.19em;color:#e7bf82;font-size:.78rem;font-weight:bold}.panel{background:#2d253aee;border:1px solid #a788a355;border-radius:22px;padding:23px;box-shadow:0 15px 40px #0a081633}.grid{display:grid;grid-template-columns:repeat(3,minmax(0,1fr));gap:17px}.room{border:1px solid #bfa27355;border-radius:19px;background:linear-gradient(145deg,#40324d,#292235);padding:22px;text-align:left;color:#f9eacb;min-height:190px;display:flex;flex-direction:column;gap:8px;transition:transform .15s,border .15s}.room:not(:disabled):hover{transform:translateY(-3px);border-color:#e4bf7e}.room:disabled{opacity:.49;cursor:not-allowed}.room .emoji{font-size:2.3rem}.room strong{font-size:1.25rem}.room span:last-child{font-size:.84rem;color:#d9c7d8}.actions{display:flex;gap:10px;flex-wrap:wrap;align-items:center}.btn{border:1px solid #d9b87d;border-radius:12px;padding:10px 16px;background:#d9b87d;color:#281e31;font-weight:bold}.btn.secondary{background:#3d314a;color:#f6e4c4}.btn.ghost{background:transparent;color:#ead6ac;border-color:#a88d6d}.btn:disabled{opacity:.4;cursor:not-allowed}.heading{font-size:1.8rem;color:#f1d39b;margin:0 0 12px}.muted{color:#d7c5d7}.setup{max-width:740px;margin:25px auto}.field{margin:16px 0}.field label{display:block;margin-bottom:8px;color:#f5dfb1}.field select,.field input{background:#1e192a;border:1px solid #a990a3;color:#fff5df;border-radius:10px;padding:10px;width:100%}.checkgrid{display:grid;grid-template-columns:repeat(3,1fr);gap:10px}.checktile{display:flex;align-items:center;gap:8px;background:#3d3049;border:1px solid #725d7b;border-radius:12px;padding:12px}.checktile input{width:auto;accent-color:#e5bd79}.notice{border-left:3px solid #e6c185;padding:10px 13px;background:#44354c;margin:16px 0;color:#f3e4d2}.challenge{max-width:890px;margin:20px auto}.challenge h2{font-size:2rem;color:#f3d399;margin:8px 0}.quote{background:#1e192b;border-left:4px solid #d7b579;border-radius:12px;padding:16px;margin:13px 0;font-size:1.12rem}.options{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:10px;margin:15px 0}.option{padding:15px;text-align:left;border:1px solid #8b7592;background:#3c304a;color:#f6eadc;border-radius:12px}.option.selected{background:#625077;border:2px solid #f0c987;padding:14px}.result{padding:14px;background:#473c51;border-radius:12px;margin:12px 0}.feedback{color:#f5d79d}.question{background:#49364e;border:1px solid #a68888;border-radius:15px;padding:18px;margin:18px 0}.question strong{color:#f8d998}.steps{display:flex;gap:8px;flex-wrap:wrap;margin:15px 0}.step{font-size:.8rem;border-radius:50px;padding:5px 11px;border:1px solid #7e6b86;color:#e6d5df}.step.active{background:#d9b87d;color:#2d2031}.teacher{background:#263e3d;border:1px solid #83aca1;border-radius:13px;padding:15px;margin:12px 0}.teacher h3{margin:0 0 8px;color:#ccebdc}.footer{text-align:center;margin-top:45px;color:#baa9c3;font-size:.8rem}.hidden{display:none!important}.toast{padding:10px;border-radius:10px;background:#3c5146;color:#f3ffef;margin-top:12px}a{color:#f7d697}@media(max-width:750px){.grid{grid-template-columns:repeat(2,minmax(0,1fr))}.shell{padding:15px 13px 60px}.room{min-height:170px;padding:16px}.checkgrid{grid-template-columns:repeat(2,1fr)}}@media(max-width:470px){.grid,.options{grid-template-columns:1fr}.hero{padding:20px 4px}.room{min-height:unset}.top{align-items:flex-start}}
</style></head><body><div class="shell"><header class="top"><div class="brand">✦ THE MAGICAL ELA CAFÉ</div><div class="actions"><span id="modeBadge" class="small"></span><button class="pill" id="homeBtn">⌂ Lobby</button><button class="pill" id="setupBtn">⚙ Teacher Setup</button></div></header><main id="app"></main><footer class="footer">A little magic. A lot of mastery. ✨ · 7th Grade Visual DBA Playground · No student information collected</footer></div><script>
'use strict';
const rooms=[['🌿','The Enchanted Story Garden','Figurative language · central idea · theme · hyphens · setting and mood'],['🪶','The Research & Remedy Room','Informative problem–solution writing conference'],['🧪','The Persuasion Parlor','Fallacies · purpose · perspective · allusions · comparing authors'],['⚙️','The Great Debate Workshop','Argumentative writing conference: humans vs. machines'],['📖','The Storybook Sanctuary','Short stories · summary · conflict · characters · theme · poetry'],['🕰️','The Storyteller’s Studio','Narration and narrative techniques']];
const activities=[
{title:'Mirror of Comparisons',icon:'🪞',skill:'Similes and metaphors',intro:'Examine the enchanted garden descriptions.',prompt:'“The moon was a silver coin above the garden.”',question:'What type of figurative language is used?',options:['Simile','Metaphor','Neither'],answer:1,why:'A metaphor directly compares the moon to a silver coin without using like or as.',talk:'What two things are compared? What picture does the comparison create for the reader?',apply:'Create a simile that describes the same moon. How is your comparison different?',hint:'Look for a comparison that does not use like or as.',variants:[['“The leaves danced like tiny emerald flags in the wind.”','What type of figurative language is used?',['Simile','Metaphor','Neither'],0,'Like introduces a comparison between leaves and flags.'],['“The old oak was a guardian at the garden gate.”','What type of figurative language is used?',['Simile','Metaphor','Neither'],1,'The oak is directly described as a guardian.']]},
{title:'The Central Idea Tree',icon:'🌳',skill:'Central idea',intro:'Read the informational passage and choose the central idea.',prompt:'“City gardens provide more than beautiful spaces. They give pollinators food, help cool neighborhoods, and offer residents places to grow vegetables. Even small gardens can benefit the community.”',question:'Which statement best expresses the central idea?',options:['Gardens always grow vegetables.','City gardens benefit communities in several ways.','Pollinators only live in cities.'],answer:1,why:'The passage describes several different benefits of city gardens; the central idea includes them all.',talk:'Which two details from the passage support the central idea? Why is a single detail not the central idea?',apply:'Give the passage a heading that communicates its central idea.',hint:'Choose the idea that covers the whole passage, not just one fact.',variants:[['“Public libraries lend books, but they also offer internet access, workshops, and quiet places to study. These services help people of many ages learn.”','Which is the best central idea?',['Libraries only lend books.','Libraries support learning through many services.','Workshops are always quiet.'],1,'All the examples show how libraries help people learn.']]},
{title:'The Growing Theme',icon:'🌱',skill:'Theme development',intro:'Follow the events in this miniature story.',prompt:'“Mira failed to grow her first seedlings. She wanted to abandon the garden, but her grandfather encouraged her to try again. She adjusted the sunlight and watering. Weeks later, green shoots appeared, and Mira smiled at what patience had made possible.”',question:'Which theme is best supported by the events?',options:['Gardens need sunlight.','Persistence can lead to growth.','Grandparents know everything.'],answer:1,why:'Mira faces failure, makes changes, persists, and eventually succeeds. The events develop the theme of persistence.',talk:'How does Mira change from the beginning to the end? Which event most strongly develops the theme?',apply:'Suggest another event that would reinforce the same theme.',hint:'A theme is a message about life, not just the topic of gardening.',variants:[['“Jon was afraid to perform. He practiced in small groups, then volunteered to read a poem aloud. His voice shook, but he finished and felt proud.”','Which theme is best supported?',['Courage can mean acting despite fear.','Poetry is always easy.','Performers never feel nervous.'],0,'Jon acts even though he remains afraid.']]},
{title:'The Hyphen Spell',icon:'✨',skill:'Hyphens',intro:'Help the café repair its enchanted signs.',prompt:'“Try our freshly baked, sugar free cookies!”',question:'Which revision correctly uses a hyphen in the compound modifier?',options:['Try our freshly-baked, sugar free cookies!','Try our freshly baked, sugar-free cookies!','Try our freshly baked, sugar free-cookies!'],answer:1,why:'Sugar-free is a compound modifier before cookies. An -ly adverb such as freshly does not typically take a hyphen with the participle it modifies.',talk:'Why is sugar-free hyphenated here? Why is freshly baked not hyphenated?',apply:'Use a correctly hyphenated compound modifier in your own café advertisement.',hint:'Look for two words that work together to describe a noun before it.',variants:[['“The cafe displayed a well known recipe.”','Which revision is correct?',['The cafe displayed a well-known recipe.','The cafe displayed a well known-recipe.','The cafe displayed a wellknown recipe.'],0,'Well-known modifies recipe before the noun.']]},
{title:'The Mood Changer',icon:'🌧️',skill:'Setting and mood',intro:'Read the description and notice the sensory details.',prompt:'“The empty café creaked as rain struck the dark windows. A single candle flickered, casting long shadows across the floor.”',question:'What mood do the setting details most strongly create?',options:['Playful and cheerful','Tense and eerie','Peaceful and sunny'],answer:1,why:'Creaking, dark windows, flickering light, and long shadows create an uneasy atmosphere.',talk:'Which words or images establish the mood? How does the setting influence the reader’s feelings?',apply:'Change two details to make the same café feel welcoming instead.',hint:'Imagine how you would feel if you were standing in this setting.',variants:[['“Golden sunlight spilled across the café tables. Warm cinnamon scented the air as friends laughed by the window.”','What mood is created?',['Warm and welcoming','Threatening and eerie','Lonely and hopeless'],0,'Sunlight, cinnamon, and laughter establish a cozy mood.']]}
];
const params=new URLSearchParams(location.search);const studentLink=params.get('view')==='student';const parsed=(params.get('modules')||'1').split(',').map(Number).filter(n=>n>=1&&n<=6);let unlocked=[...new Set(parsed.length?parsed:[1])];let mode=studentLink?'student':'teacher';let route='lobby',module=1,activity=0,variant=0,selected=-1,showHint=false,showAnswer=false,showApply=false,showFeedback=false;const app=document.getElementById('app');const esc=s=>String(s).replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));function resetActivity(){selected=-1;showHint=false;showAnswer=false;showApply=false;showFeedback=false}function getData(){const a=activities[activity];if(variant===0)return {prompt:a.prompt,question:a.question,options:a.options,answer:a.answer,why:a.why};const v=a.variants[(variant-1)%a.variants.length];return{prompt:v[0],question:v[1],options:v[2],answer:v[3],why:v[4]}}function updateTop(){document.getElementById('modeBadge').textContent=mode==='teacher'?'✦ Teacher-Led':'✦ Student Explorer';document.getElementById('setupBtn').classList.toggle('hidden',studentLink)}function lobby(){route='lobby';updateTop();app.innerHTML=`<section class="hero"><div class="spark">☕ ✨ 📚</div><div class="eyebrow">Welcome, curious minds</div><h1>The Magical ELA Café</h1><p>Step inside, choose your enchanted learning room, and show what you know. Every great answer begins with a little curiosity.</p></section><div class="grid">${rooms.map((r,i)=>`<button class="room" data-room="${i+1}" ${unlocked.includes(i+1)?'':'disabled'}><span class="emoji">${r[0]}</span><strong>Module ${i+1}<br>${r[1]}</strong><span>${unlocked.includes(i+1)?r[2]:'🔒 Currently closed'}</span></button>`).join('')}</div>${mode==='teacher'?'<p class="small" style="text-align:center;margin-top:18px">Teacher tip: Use ⚙ Teacher Setup to choose which rooms students see.</p>':''}`;app.querySelectorAll('[data-room]').forEach(b=>b.onclick=()=>openModule(Number(b.dataset.room)))}
function openModule(n){if(!unlocked.includes(n))return;module=n;route='module';updateTop();if(n!==1){app.innerHTML=`<section class="challenge panel"><div class="eyebrow">Module ${n}</div><h2>${rooms[n-1][0]} ${rooms[n-1][1]}</h2><p>${rooms[n-1][2]}</p><div class="notice">This room is reserved for the next build phase. Module 1 is the fully interactive prototype.</div><button class="btn secondary" id="back">← Back to Café</button></section>`;document.getElementById('back').onclick=lobby;return}moduleMenu()}
function moduleMenu(){route='module';app.innerHTML=`<section class="hero"><div class="eyebrow">Module 1 · The Enchanted Story Garden</div><h1>Choose a Mastery Challenge</h1><p>Explore a skill, make a choice, then explain your thinking aloud.</p></section><div class="grid">${activities.map((a,i)=>`<button class="room" data-act="${i}"><span class="emoji">${a.icon}</span><strong>${a.title}</strong><span>${a.skill}</span></button>`).join('')}</div><div class="actions" style="margin-top:22px"><button class="btn ghost" id="back">← Café Lobby</button></div>`;app.querySelectorAll('[data-act]').forEach(b=>b.onclick=()=>{activity=Number(b.dataset.act);variant=0;resetActivity();challenge()});document.getElementById('back').onclick=lobby}
function challenge(){route='challenge';const a=activities[activity],d=getData();app.innerHTML=`<section class="challenge"><div class="actions"><button class="btn ghost" id="back">← All Challenges</button><span class="small">Module 1 · ${esc(a.skill)}</span></div><div class="panel" style="margin-top:16px"><div class="eyebrow">${a.icon} The Enchanted Story Garden</div><h2>${esc(a.title)}</h2><p class="muted">${esc(a.intro)}</p><div class="steps"><span class="step active">1 · Discover</span><span class="step">2 · Explain</span><span class="step">3 · Apply</span></div><div class="quote">${esc(d.prompt)}</div><h3>${esc(d.question)}</h3><div class="options">${d.options.map((o,i)=>`<button class="option ${selected===i?'selected':''}" data-opt="${i}" aria-pressed="${selected===i}">${esc(o)}</button>`).join('')}</div><div class="actions"><button class="btn secondary" id="hint">${showHint?'Hide Hint':'💡 Hint'}</button><button class="btn secondary" id="explain">${showFeedback?'Hide Explanation Prompt':'💬 Explain Your Thinking'}</button><button class="btn secondary" id="apply">${showApply?'Hide Application':'✨ Apply It'}</button></div>${showHint?`<div class="result"><strong>Gentle hint:</strong> ${esc(a.hint)}</div>`:''}${showFeedback?`<div class="question"><strong>Explain aloud:</strong><p>${esc(a.talk)}</p></div>`:''}${showApply?`<div class="question"><strong>Apply your knowledge:</strong><p>${esc(a.apply)}</p></div>`:''}${mode==='teacher'?`<div class="teacher"><h3>🔎 Teacher Guide</h3><button class="btn secondary" id="answer">${showAnswer?'Hide Suggested Answer':'Reveal Suggested Answer'}</button>${showAnswer?`<p><strong>Correct choice:</strong> ${esc(d.options[d.answer])}</p><p>${esc(d.why)}</p><p><strong>Look for:</strong> A reasoned explanation using relevant text evidence, not just the correct selection.</p>`:''}</div>`:''}<div class="actions" style="margin-top:22px"><button class="btn ghost" id="another">↻ Try Another Example</button><button class="btn ghost" id="reset">Reset</button><button class="btn" id="next">Next Skill →</button></div></div></section>`;document.getElementById('back').onclick=moduleMenu;app.querySelectorAll('[data-opt]').forEach(b=>b.onclick=()=>{selected=Number(b.dataset.opt);challenge()});document.getElementById('hint').onclick=()=>{showHint=!showHint;challenge()};document.getElementById('explain').onclick=()=>{showFeedback=!showFeedback;challenge()};document.getElementById('apply').onclick=()=>{showApply=!showApply;challenge()};if(mode==='teacher')document.getElementById('answer').onclick=()=>{showAnswer=!showAnswer;challenge()};document.getElementById('another').onclick=()=>{variant=(variant+1)%(a.variants.length+1);resetActivity();challenge()};document.getElementById('reset').onclick=()=>{resetActivity();challenge()};document.getElementById('next').onclick=()=>{activity=(activity+1)%activities.length;variant=0;resetActivity();challenge()}}
function setup(){if(studentLink)return;route='setup';updateTop();app.innerHTML=`<section class="panel setup"><div class="eyebrow">Behind the counter</div><h2 class="heading">⚙ Teacher Setup</h2><p class="muted">Choose which module rooms are visible in the student link. This setup does not collect or save student information.</p><div class="field"><label>Unlock modules</label><div class="checkgrid">${rooms.map((r,i)=>`<label class="checktile"><input type="checkbox" data-mod="${i+1}" ${unlocked.includes(i+1)?'checked':''}> Module ${i+1}</label>`).join('')}</div></div><div class="field"><label for="mode">How will this DBA run?</label><select id="mode"><option value="teacher" ${mode==='teacher'?'selected':''}>Teacher-Led · You click and screen-share</option><option value="student" ${mode==='student'?'selected':''}>Student Explorer · Student clicks independently</option></select></div><div class="notice"><strong>Privacy & access:</strong> Student links only show the selected module rooms in the interface. They are not secure locks. Anyone with a link can inspect publicly served website files. Teacher guides in this prototype are convenience features, not confidential assessment keys.</div><div class="actions"><button class="btn" id="save">Apply Settings</button><button class="btn secondary" id="copy">Copy Student Link</button><button class="btn ghost" id="back">Cancel</button></div><div id="status" role="status" aria-live="polite"></div></section>`;document.getElementById('mode').onchange=e=>mode=e.target.value;document.getElementById('save').onclick=()=>{if(!readChecks())return;const u=new URL(location.href);u.search='';history.replaceState(null,'',u.pathname);lobby()};document.getElementById('copy').onclick=async()=>{if(!readChecks())return;const u=new URL(location.href);u.search='';u.searchParams.set('view','student');u.searchParams.set('modules',unlocked.join(','));try{await navigator.clipboard.writeText(u.href);document.getElementById('status').innerHTML='<div class="toast">Student link copied! Send it to your student.</div>'}catch{document.getElementById('status').innerHTML=`<div class="toast">Copy this link: <input aria-label="Student link" readonly value="${esc(u.href)}" onclick="this.select()"></div>`}};document.getElementById('back').onclick=lobby}
function readChecks(){const checked=[...document.querySelectorAll('[data-mod]:checked')].map(e=>Number(e.dataset.mod));if(!checked.length){document.getElementById('status').textContent='Unlock at least one module.';return false}unlocked=checked;return true}
document.getElementById('homeBtn').onclick=lobby;document.getElementById('setupBtn').onclick=setup;updateTop();lobby();
</script></body></html>
